# tests/alb/nginx.conf -- a stand-in for the AWS Application Load Balancer.
#
# Used only by tests/alb/docker-compose.alb.yml (the Docker Smoke job's ALB
# rehearsal). It reproduces the listener rules of the planned AWS topology
# (Stream C, design C3), not the dashboard's own nginx:
#
#   /api/*, /health, /health/*, /metrics  -> the API target group  (api:8000)
#   everything else (the default action)  -> the dashboard         (frontend:8080)
#
# and, like an ALB, it passes the client's Host header through unchanged and
# tells the target the client spoke HTTPS. That is the point of the exercise:
# the API sees the public hostname (PUBLIC_BASE_URL), so its Host allow-list
# is what decides whether a non-probe request gets through.
#
# The path set is copied from the design by hand. When the CDK listener rules
# land (C3), this file and those rules must name the same paths; nothing checks
# that they do.
#
# Nothing here is a production config: no TLS, no timeouts tuned, no limits.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Each location repeats its proxy_set_header lines: nginx does not inherit
    # them into a location that sets any of its own.

    # ALB rule: /api/* -> API, written as the prefix `/api/` (a bare `/api`
    # does not match it and falls to the dashboard).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ALB rule: /health, /health/*, /metrics -> API (exact /health, prefix
    # /health/, exact /metrics).
    location = /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /health/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /metrics {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Default action -> the dashboard container.
    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
