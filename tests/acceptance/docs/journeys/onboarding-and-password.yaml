# The Authentication User Guide (docs/auth/auth-user-guide.md) with local
# sign-in, the dashboard's default (#939): an administrator signs in and, on
# Admin -> Users, invites one account of each of the four roles ("Invite User
# creates an account with a temporary password, shown once"); each new account
# signs in with that password, meets the admin area as its role does ("Opening
# it needs a superuser account, whatever its role"; "An account invited with the
# Admin role is also made a superuser") and changes its password with Change
# password, next to Log out. Then the Viewer signs in with the old password,
# which is refused, and with the new one, which works.
#
# The old and the new password are tried for one account, not four, because of
# the API's sign-in limit: POST /api/v1/auth/login answers 10 requests a minute
# from one address (backend/app/middleware/rate_limiter.py), every journey on
# the compose stack signs in from the same one, and this runner never waits for
# a time. The three journeys of this stack sign in 10 times in all: once in
# docker-guide, 7 times here (the administrator, the four first sign-ins, the
# refused old password and the new one), twice in quick-start. Four password
# changes stay under that route's own limit (5 a minute).
#
# Nothing typed or shown here that the run makes up is written to the run
# directory (docs_runner/redaction.py): the one-time passwords are kept from the
# "User created" dialog by keep steps, the new passwords are made up when the
# journey starts (passwords), every fill of either says snapshot: false, the
# step that opens the dialog keeps no screen, and the journey is not recorded
# (video: false), because a recording would show the dialog.
#
# Every sign-in starts at /login, as the guide's Standard Login does. Where the
# browser lands after Log out is a race in the dashboard: from a signed-in page
# it was /login?next=<that page> (measured 2026-10-06 on the dashboard's own
# development server), and the next sign-in then opens that page, not the
# dashboard. So the log-out steps check the sign-in form, not the address.
#
# The demo administrator's password (Demo1234!) is the Quick Start's documented
# demo credential; this guide does not give it.
#
# Expectations written on 2026-10-06 from the guide and the dashboard's source,
# before the first run.
guide: auth/auth-user-guide.md
stack: compose-dev
profile: core
video: false
written: 2026-10-06
passwords: [admin-new, developer-new, analyst-new, viewer-new]
steps:
  - id: sign-in-page
    doc: standard-login
    do:
      goto: /login
    expect:
      status: 200
      aria: |
        - main:
          - heading "Sign in" [level=1]
          - textbox "Email"
          - textbox "Password"
          - button "Sign in"
    fail: there is no sign-in page at /login
  - id: demo-admin-email
    doc: standard-login
    do:
      fill:
        label: Email
        value: admin@demo.com
    expect:
      aria: |
        - main:
          - textbox "Email": admin@demo.com
    fail: the sign-in page has no Email field
  - id: demo-admin-password
    doc: standard-login
    do:
      fill:
        label: Password
        value: Demo1234!
