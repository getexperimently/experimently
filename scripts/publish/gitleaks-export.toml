# gitleaks configuration for the publication sweep (scripts/publish/export.sh).
#
# [extend] useDefault is the whole point: a gitleaks config that defines no
# rules and does not extend the defaults scans with NO RULES. The repository's
# own .gitleaks.toml had exactly that shape from the day it was added, so every
# scan that used it -- CI, core_build.sh, and this sweep's first version --
# could not find anything. Tamper-tested on 2026-09-13 by planting an AWS key
# and a GitHub token in a scratch commit: 0 findings before, 2 after.
title = "publication sweep"

[extend]
useDefault = true

# No path is exempt: tests, docs and fixtures are published and are scanned.
# The only allowlist is this list of literal placeholder values, every one of
# them visibly fake, that the default rules match in this repository's history
# (104 findings, 31 distinct values, reviewed one by one -- none a secret).
# A real credential does not look like any of these. Add to this list only a
# value you have read and can name.
[allowlist]
description = "reviewed placeholder values"
stopwords = [
  # curl examples in the docs, before they were rewritten to <angle-bracket> form
  "your_access_token", "your_api_key", "your-api-key", "YOUR_API_KEY",
  "your_admin_token", "your-api-key-here", "expired_token",
  # example keys in docs and docstrings
  "sk-live-xxxx", "sk-prod-abc123", "sk-live-abc123", "sk_live_123abc",
  "ep_live_a1b2c3", "1234567890ABCDEF",
  # test fixtures
  "StrongPass123", "Str0ng-Passw0rd", "abcdef1234567890", "owner-flag-001",
  "dev-token-admin", "Ed25519PrivateKey",
  # truncated example JWTs (a real token is far longer and never ends in ...)
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9", "eyJjdHkiOiJKV1Q", "eyJraWQiOiJ",
  "eyJ0eXAiOiJKV1Q", "eyJhbGciOiJSUzI1NiIs",
  # variable names the generic rule mistakes for keys
  "num_buckets", "FLAG_KEYS", "default_variant",
]
