# The documents whose shell examples are checked by scripts/doc_examples.py.
# Each count is exact: a document whose tags or expectations change must change
# its numbers here, so an example cannot drop out of the check silently.
# The counts are what `python scripts/doc_examples.py --check` prints; never
# adjust them to make a check pass -- find out why they moved.
#
# [meta] universe is every in-scope Markdown page the check's walk finds
# (every *.md except CLAUDE.md, pruning node_modules, venv, site and
# dot-directories other than .github).  A page with a shell block is exactly one
# of: enrolled ([[document]]), exempt ([[exempt]], with a reason) or pending.
# [pending] is the rollout: it can only shrink (the list is frozen in
# scripts/doc_examples.py), and each page's residual counts can only fall.

