name: experimentation_sdk
description: Flutter SDK for the Experimentation Platform — feature flags, A/B tests, and event tracking with local evaluation and offline fallback.
version: 0.1.0
homepage: https://github.com/experimentation-platform/sdk

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.0
  build_runner: ^2.4.0
  flutter_lints: ^3.0.0
