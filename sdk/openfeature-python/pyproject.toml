[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "experimentation-openfeature"
version = "0.1.0"
description = "OpenFeature provider for the Experimentation Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["openfeature", "feature-flags", "experimentation", "a/b-testing"]
dependencies = [
    "openfeature-sdk>=0.7.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "responses>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
