[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "experimently-openfeature"
version = "1.0.0"
description = "OpenFeature provider for Experimently (server-side flag evaluation)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["openfeature", "feature-flags", "experimentation", "a/b-testing"]
dependencies = [
    # 0.9.0 introduced the tracking API (AbstractProvider.track / TrackingEventDetails).
    "openfeature-sdk>=0.9.0",
    "experimently>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
