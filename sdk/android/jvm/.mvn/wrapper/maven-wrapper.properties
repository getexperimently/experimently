# Maven wrapper for the Android SDK's JVM variant.
#
# `distributionType=only-script` means no maven-wrapper.jar is committed: mvnw
# downloads the pinned Maven distribution itself and verifies it against
# distributionSha256Sum below. Regenerate with
#   mvn -N wrapper:wrapper -Dmaven=<version> -Dtype=only-script
# and update the checksum from
#   https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/<version>/
#
# Kept on the same version as sdk/java/.mvn/wrapper/maven-wrapper.properties.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
distributionSha256Sum=4ec3f26fb1a692473aea0235c300bd20f0f9fe741947c82c1234cefd76ac3a3c
