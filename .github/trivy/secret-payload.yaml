# trivy secret-scanner configuration for the release payload scan
# (.github/workflows/release.yml, "Scan the payload with every allow rule off").
#
# The payload is what this project itself ships: /app in the API images,
# /usr/share/nginx/html and /etc/nginx in the dashboard images. Nothing in it
# is exempt, so every built-in allow rule of trivy 0.74.0 is switched off, by
# the IDs pkg/fanal/secret/builtin-allow-rules.go gives them. A misspelled ID
# is not an error: trivy quietly keeps that rule, so the release test
# backend/tests/unit/infrastructure/test_release_credential_scan.py pins the
# exact list below.
disable-allow-rules:
  - dist-info
  - tests
  - examples
  - vendor
  - usr-dirs
  - locale-dir
  - markdown
  - node.js
  - golang
  - python
  - rubygems
  - wordpress
  - anaconda-log
# An empty list replaces trivy's second built-in skip list
# (defaultSkipPatterns in pkg/fanal/secret/scanner.go: node_modules, .git,
# lockfiles, *.svg, *.gz, *.zip, *.png and more), which applies whatever the
# allow rules say.
skip-patterns: []
