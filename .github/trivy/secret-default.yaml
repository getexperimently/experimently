# trivy secret-scanner configuration for the release image scan
# (.github/workflows/release.yml, "Scan the image for stored credentials").
#
# trivy's defaults, stated explicitly: the image scan reads the whole image
# with the built-in allow rules on, and the payload scan
# (secret-payload.yaml) covers this project's own files with them off. The
# file exists so the workflow names a configuration it owns rather than
# whatever trivy-secret.yaml the checked-out tree might carry; an empty file
# is refused by trivy ("secrets config decode error: EOF"), hence the one key.
disable-allow-rules: []
