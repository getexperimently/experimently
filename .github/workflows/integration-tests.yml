name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: experimentation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      # Creates the schema from the models on a fresh database and stamps the
      # alembic head (see backend/app/db/bootstrap.py); on an existing
      # database it runs `alembic upgrade head`.
      - name: Bootstrap database schema
        env:
          APP_ENV: test
          TESTING: "true"
          POSTGRES_DB: experimentation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_SCHEMA: test_experimentation
          DATABASE_URI: "postgresql://postgres:postgres@localhost:5432/experimentation_test"
        run: python -m backend.app.db.bootstrap

      - name: Run integration tests
        env:
          APP_ENV: test
          TESTING: "true"
          POSTGRES_DB: experimentation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_SCHEMA: test_experimentation
          DATABASE_URI: "postgresql://postgres:postgres@localhost:5432/experimentation_test"
        run: |
          # No marker filter: 30 of the integration files carry no marker and were
          # silently deselected (570 of 1462 tests, including every regression test
          # for the tracking API, results engine, bandits and assignment eligibility).
          python -m pytest backend/tests/integration/ -v \
            --tb=short \
            --junit-xml=test-results/integration.xml

      - name: Run E2E workflow tests
        env:
          APP_ENV: test
          TESTING: "true"
          POSTGRES_DB: experimentation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_SCHEMA: test_experimentation
          DATABASE_URI: "postgresql://postgres:postgres@localhost:5432/experimentation_test"
        run: |
          python -m pytest backend/tests/e2e/ -v \
            --tb=short \
            -m "e2e" \
            --junit-xml=test-results/e2e.xml

      - name: Run contract tests
        env:
          APP_ENV: test
          TESTING: "true"
          POSTGRES_DB: experimentation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_SCHEMA: test_experimentation
          DATABASE_URI: "postgresql://postgres:postgres@localhost:5432/experimentation_test"
        run: |
          python -m pytest backend/tests/contract/ -v \
            --tb=short \
            -m "contract" \
            --junit-xml=test-results/contract.xml

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30
