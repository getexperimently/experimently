name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


# Supersede an in-flight run of the same pull request; a batch of Dependabot
# rebases with no group here turned into roughly 2000 jobs and exhausted the
# Actions spending limit.
#
# `github.ref` rather than `github.head_ref`: for a pull request `github.ref`
# is the unique `refs/pull/<n>/merge`, while `head_ref` is the bare branch
# name with no fork owner, so two contributors pushing a branch both named
# `patch-1` -- GitHub's default for a web-UI edit -- would cancel each other's
# required checks. `github.event_name` keeps the triggers in separate groups.
#
# Only pull requests are cancelled. A push to main runs to completion: cancel
# it and the commit that is actually on main carries a cancelled status, and a
# failure it introduced is attributed to whichever merge landed next.
concurrency:
  group: integration-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The suite in four pieces, each a full job with its own services. A test
  # belongs to piece `i` when sha256(its node id) % 4 == i-1
  # (backend/tests/shard.py), so the pieces need no durations file and a new
  # test moves no other. The required check is the `integration-tests` job
  # below, not these.
  shard:
    name: integration-tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.shard == 3 && 1 || 30 }}
    strategy:
      # One red shard must not cancel the others: the summary needs every
      # shard's report to say which tests failed and that the rest ran.
      fail-fast: false
      matrix:
        # The one hand-typed list. The total is `strategy.job-total`, never
        # typed: a repeated or missing number leaves a shard number with no
        # report, and the summary refuses that.
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: experimentation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      # Editable, from the repository root, as nightly-qa and a developer venv
      # install it. Its finder maps `modules` back into this checkout from any
      # directory -- the leak the core-tree tests must survive (#47). Without
      # it they pass whatever the harness does, so the integration run sets
      # EXPERIMENTLY_REQUIRE_EDITABLE and test_the_integration_job_is_armed
      # fails if this step is ever dropped.
      - name: Install the repository (editable)
        run: pip install -e . --no-deps

      # Creates the schema from the models on a fresh database and stamps the
      # alembic head (see backend/app/db/bootstrap.py); on an existing
      # database it runs `alembic upgrade head`.
      - name: Bootstrap database schema
        env:
          APP_ENV: test
          TESTING: "true"
          POSTGRES_DB: experimentation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_SCHEMA: test_experimentation
          DATABASE_URI: "postgresql://postgres:postgres@localhost:5432/experimentation_test"
        run: python -m backend.app.db.bootstrap

      # A second Redis that requires a password, for
      # backend/tests/integration/test_redis_password_auth.py (#236). The
      # `redis` service above is plaintext and passwordless, and a service
      # container takes no command, so this one is started here. The password
      # is generated per run and handed to the tests through GITHUB_ENV.
      - name: Start a password-protected Redis
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          docker run -d --name redis-auth -p 6380:6379 redis:7-alpine \
            redis-server --requirepass "${password}"
          for _ in $(seq 1 30); do
            if docker exec redis-auth redis-cli --no-auth-warning -a "${password}" ping | grep -q PONG; then
              {
                echo "REDIS_AUTH_TEST_PORT=6380"
                echo "REDIS_AUTH_TEST_PASSWORD=${password}"
              } >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs redis-auth
          exit 1

      - name: Run integration tests
        env:
          APP_ENV: test
          TESTING: "true"
          POSTGRES_DB: experimentation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_SCHEMA: test_experimentation
          DATABASE_URI: "postgresql://postgres:postgres@localhost:5432/experimentation_test"
          EXPERIMENTLY_REQUIRE_EDITABLE: "1"
          # The password-protected Redis must be there: a skip is a failure.
          EXPERIMENTLY_REQUIRE_REDIS_AUTH: "1"
          # So must the `redis` service: the Redis tests (the experiment
          # cache, and the flag reads after every writer, #630) skip without
          # it, and here a skip is a failure.
          EXPERIMENTLY_REQUIRE_REDIS: "1"
          # This step's slice of the suite, and where it records what it
          # collected, selected and ran. On this step only: in the job's env
          # it would also slice the e2e and contract runs below and drop three
          # quarters of them. The report is outside the checkout, under a
          # name unique to the shard.
          EXPERIMENTLY_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          EXPERIMENTLY_TEST_SHARD_REPORT: ${{ runner.temp }}/shard-integration-${{ matrix.shard }}.json
        run: |
          # No marker filter: 30 of the integration files carry no marker and were
          # silently deselected (570 of 1462 tests, including every regression test
          # for the tracking API, results engine, bandits and assignment eligibility).
          python -m pytest backend/tests/integration/ -v \
            --tb=short \
            --junit-xml="test-results/integration-${{ matrix.shard }}.xml"

      # Unsharded, in shard 1 only, gated by their own exit status as before.
      - name: Run E2E workflow tests
        if: matrix.shard == 1
        env:
          APP_ENV: test
          TESTING: "true"
          POSTGRES_DB: experimentation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_SCHEMA: test_experimentation
          DATABASE_URI: "postgresql://postgres:postgres@localhost:5432/experimentation_test"
        run: |
          python -m pytest backend/tests/e2e/ -v \
            --tb=short \
            -m "e2e" \
            --junit-xml=test-results/e2e.xml

      - name: Run contract tests
        if: matrix.shard == 1
        env:
          APP_ENV: test
          TESTING: "true"
          POSTGRES_DB: experimentation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_SCHEMA: test_experimentation
          DATABASE_URI: "postgresql://postgres:postgres@localhost:5432/experimentation_test"
        run: |
          python -m pytest backend/tests/contract/ -v \
            --tb=short \
            -m "contract" \
            --junit-xml=test-results/contract.xml

      # Names unique to the shard, and `overwrite`, because artifacts are
      # immutable and a re-run of one shard uploads the same name again.
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          overwrite: true
          retention-days: 30

      # Even when the suite failed: the summary reads every shard's report.
      - name: Upload the shard report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shard-report-integration-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-integration-${{ matrix.shard }}.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  # The required check, under its id (no `name:`), as the single job reported
  # it before the split. Green only when every shard succeeded and the shards
  # between them ran every collected integration test exactly once.
  #
  # `always()`, like the three other required summaries (Release Gate
  # Summary, SDK Unit Tests and the scan workflow's), so that it always reports
  # an explicit result and a failure names what failed. `!cancelled()` would fail
  # closed too -- on a cancelled run it reports `cancelled`, not `skipped` --
  # but says nothing. The cost of `always()`: when a newer push supersedes a
  # pull request's run, the old run holds the concurrency group until this job
  # has queued and run.
  integration-tests:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # No report at all is the checker's to judge (it fails), so a download
      # that finds nothing must not end the job before it.
      - name: Collect the shard reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: shard-report-integration-*
          path: ${{ runner.temp }}/shard-reports

      - name: Every shard passed
        env:
          # The whole `needs` object, as Release Gate Summary reads it; a
          # matrix job's result covers all its legs. Only `success` passes:
          # failure, cancelled (a timeout too) and skipped are all red.
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"' > results.txt
          test -s results.txt || { printf '::error::needs produced no results\n'; exit 1; }
          failed=0
          while IFS='=' read -r job result; do
            printf '  %s: %s\n' "$job" "$result"
            case "$result" in
              success) ;;
              *) printf '::error::%s: %s\n' "$job" "$result"; failed=1 ;;
            esac
          done < results.txt
          if [ "$failed" -ne 0 ]; then
            printf '::error::integration tests failed\n'
            exit 1
          fi

      # Even after a failed shard, so the log says which tests failed and
      # whether the rest ran. The one skip allowed is the benchmark, which
      # runs only with RUN_BENCHMARKS=1 (backend/tests/benchmark_gate.py).
      - name: Every test ran in exactly one shard
        if: always()
        run: |
          python3 scripts/check_test_shards.py \
            --suite backend/tests/integration \
            --allow-skip 'backend/tests/integration=absolute-timing benchmark; set RUN_BENCHMARKS=1 to run it' \
            "$RUNNER_TEMP/shard-reports"
