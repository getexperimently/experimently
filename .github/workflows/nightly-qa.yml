name: Nightly QA Suite

# Runs the suites that are too slow for the PR gate, against a real stack.
#
# Fixed on 2026-09-11 (P1): the Python jobs install the repo (`pip install -e .`)
# on top of the pinned requirements so `backend.app.*` imports the same way it
# does in production; the browser job builds the static export and lets
# playwright.config.ts serve it, instead of the stale PLAYWRIGHT_SKIP_SERVER
# flag plus a hand-started `next dev`; and a failing night files an issue.

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-qa
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # Everything runs from the repository root: the package is imported as
      # `backend.app.*`, and `pip install -e .` makes that true for any cwd.
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e . --no-deps

      - name: Run unit tests
        env:
          APP_ENV: test
          TESTING: 'true'
          POSTGRES_SERVER: localhost
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_SCHEMA: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: python -m pytest backend/tests/unit/ -p no:cov -q --tb=short

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e . --no-deps

      - name: Run integration tests
        env:
          APP_ENV: test
          TESTING: 'true'
          POSTGRES_SERVER: localhost
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_SCHEMA: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: python -m pytest backend/tests/integration/ -p no:cov -q --tb=short

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e . --no-deps

      # `test_production.py` talks to a deployed environment; without
      # SMOKE_TEST_API_URL it is skipped rather than failed.
      - name: Run smoke tests
        env:
          APP_ENV: test
          TESTING: 'true'
          POSTGRES_SERVER: localhost
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_SCHEMA: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          python -m pytest backend/tests/smoke/ -p no:cov -q --tb=short \
            --ignore=backend/tests/smoke/test_production.py

  sdk-contract-tests:
    name: SDK Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pytest
        run: pip install pytest

      - name: Run Python SDK contract tests
        run: python -m pytest tests/sdk-contract/test_python_sdk.py -v

      - name: Run JavaScript SDK contract tests
        run: node tests/sdk-contract/test_js_sdk.js

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` requires package-lock.json to match package.json exactly; it is
      # the step that catches a lockfile someone forgot to commit.
      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run Jest tests
        run: cd frontend && npm test -- --passWithNoTests --watchAll=false

  e2e-tests:
    name: E2E Browser Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-tests]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e . --no-deps

      # Schema first (the migration chain cannot be replayed from an empty
      # database), then the demo users the auth fixture logs in as.
      - name: Bootstrap and seed the database
        env:
          ENVIRONMENT: development
          AUTH_PROVIDER: local
          SECRET_KEY: ci-only-nightly-e2e-secret-key-0123456789abcdef0123456789
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_SCHEMA: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          python -m backend.app.db.bootstrap
          python backend/scripts/seed_demo_data.py

      - name: Start backend
        env:
          ENVIRONMENT: development
          AUTH_PROVIDER: local
          SECRET_KEY: ci-only-nightly-e2e-secret-key-0123456789abcdef0123456789
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_SCHEMA: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          nohup python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 \
            > backend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8000/health/ready >/dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become ready"; tail -n 100 backend.log; exit 1

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # playwright.config.ts serves frontend/out with tests/e2e/static-server.mjs
      # when the export exists — the same files nginx serves in the image.
      - name: Build the dashboard (static export)
        env:
          # Same origin: the static server proxies /api, so the journeys do
          # not spend a CORS preflight per login against the 10/min limit.
          NEXT_PUBLIC_API_URL: ''
        run: cd frontend && npm run build

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run journeys (fail hard)
        env:
          PLAYWRIGHT_API_URL: http://localhost:8000
        run: cd frontend && npx playwright test --project=journeys

      # The extended project is the older specs plus accessibility and visual
      # regression. It reports but does not fail the night: the a11y backlog is
      # P4/B10 and the visual baselines are still being committed. Flip this to
      # fail-hard once both are green (delete `continue-on-error`).
      - name: Run extended suite (accessibility, visual, legacy specs)
        id: extended
        continue-on-error: true
        env:
          PLAYWRIGHT_API_URL: http://localhost:8000
        run: cd frontend && npx playwright test --project=extended

      - name: Extended suite result
        run: |
          echo "extended suite: ${{ steps.extended.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artefacts
          path: |
            frontend/playwright-results/
            backend.log
          retention-days: 14

  # A red night has to leave something behind that a human sees in the morning.
  nightly-failure-issue:
    name: File an issue on failure
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, smoke-tests, sdk-contract-tests, frontend-tests, e2e-tests]
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Nightly QA is red"
          BODY="Nightly QA failed on $(date -u '+%Y-%m-%d') (commit ${GITHUB_SHA})."$'\n\n'"Run: ${RUN_URL}"$'\n\n'"Jobs: see the run summary for which suite failed."

          # `|| true`: the label does not exist yet on the first red night.
          EXISTING=$(gh issue list --repo "$REPO" --state open --label nightly-failure \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "Commenting on existing issue #${EXISTING}"
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            echo "Opening a new issue"
            gh label create nightly-failure --repo "$REPO" --color B60205 \
              --description "Nightly QA suite failed" 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label nightly-failure --body "$BODY"
          fi
