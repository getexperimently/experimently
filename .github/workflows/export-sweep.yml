# The export sweep, on every pull request.
#
# `scripts/publish/export.sh` decides §6 item 6 of the launch checklist --
# "Nothing internal survives the export" -- and until now nothing ran it:
# `grep -rn 'export.sh' --include='*.yml' --include='Makefile' .` returned only
# the script's own usage line.
#
# `main` went unpublishable three times in eight days as a result (a2ddaac,
# 99c04f7, 6c693f6), each time found by hand. The failure is silent by
# construction: the repository looks fine, every other check is green, and the
# only symptom is that the cut cannot be taken. The last one was four
# docstrings citing a repository-root file the export removes -- introduced by
# a green PR and discovered days later (#241).
#
# (That file is deliberately not named here. This comment is itself swept, and
# naming it would make this workflow a dangling reference -- which is exactly
# how the gate caught its own author while this file was being written.)
#
# ~22 seconds of work plus the tool installs. `--skip-build` omits
# `core_build.sh`, which `core-build` and `full-build` already run.
#
# NOT a required check yet, deliberately: a gate nobody has watched is not yet
# trustworthy, and this one rewrites history in a scratch clone. Promote it
# once it has been green for a while.
name: Export Sweep

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-sweep-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same pin as pr-qa-gate.yml, so the two cannot drift to different scanners.
  GITLEAKS_VERSION: '8.30.1'
  TRUFFLEHOG_VERSION: '3.97.4'

jobs:
  export-sweep:
    name: Export Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the script clones this checkout and rewrites every
      # commit. A shallow clone rewrites a truncated history and the sweeps
      # then pass over paths that are not there -- a vacuous green.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install git-filter-repo
        run: |
          set -euo pipefail
          pip install git-filter-repo
          git filter-repo --version

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install trufflehog
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/trufflehog.tar.gz \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/trufflehog.tar.gz -C /usr/local/bin trufflehog
          trufflehog --version

      # The branch under review, not `main`. The point is to catch a dangling
      # reference or a newly-published path BEFORE it lands; running the sweep
      # over `main` on a pull request would report on the wrong tree and pass
      # while the change under review breaks it.
      #
      # A named local branch because `export.sh` clones with `--branch <ref>`,
      # and on a pull request the checkout is a detached SHA.
      - name: Sweep the branch under review
        run: |
          set -euo pipefail
          git branch -f export-candidate HEAD
          bash scripts/publish/export.sh \
            --ref export-candidate \
            --out "$RUNNER_TEMP/export" \
            --skip-build

      # The logs are the value of a failure -- without them the operator sees
      # "1 unmeasured metrics (see claims.txt)" and no claims.txt.
      #
      # But NOT the whole directory. `history-paths-before.txt` is the
      # PRE-rewrite enumeration -- 42 paths under the internal directories this
      # script removes, i.e. the name of every internal document it exists to
      # delete. (Those directory names are deliberately not written here: this
      # comment is itself swept, and naming them makes this file a dangling
      # reference. That is not hypothetical -- the first version of this very
      # comment did exactly that and the gate failed its own pull request.)
      # And `trufflehog.json` is written with no
      # redaction flag (gitleaks gets `--redact`; trufflehog has no equivalent
      # here), so a verified finding would land in it as raw text.
      #
      # Artifacts are downloadable by anyone with read access. On the public
      # repository this workstream is preparing, that is anyone at all. So the
      # gate that exists to stop internal paths being published must not
      # publish them itself: only the files that say what FAILED are uploaded.
      - name: Collect the failure evidence
        if: always()
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/export/logs"
          dst="$RUNNER_TEMP/export-evidence"
          mkdir -p "$dst"
          # Named individually. A glob or a copy-then-delete would publish any
          # file a future sweep adds, which is how this went wrong the first
          # time.
          for f in summary.txt claims.txt unmeasured.txt dangling.txt \
                   dangling-errors.txt history-check.txt manifest-check.txt \
                   forbidden-history.txt filter-repo.log gitleaks.log; do
            [ -f "$src/$f" ] && cp "$src/$f" "$dst/$f"
          done
          # gitleaks.json only if it is empty -- a finding in it is a secret.
          if [ -f "$src/gitleaks.json" ] && [ "$(tr -d '[:space:]' < "$src/gitleaks.json")" = "[]" ]; then
            cp "$src/gitleaks.json" "$dst/gitleaks.json"
          fi
          echo "collected:"; ls -la "$dst"

      - name: Upload the failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: export-sweep-evidence
          path: ${{ runner.temp }}/export-evidence/
          retention-days: 14
          if-no-files-found: warn
