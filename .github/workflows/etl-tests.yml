name: ETL & Glue Tests (P3-A)

on:
  push:
    paths:
      - 'backend/app/schemas/etl.py'
      - 'backend/app/services/etl_service.py'
      - 'backend/app/api/v1/endpoints/etl.py'
      - 'backend/lambda/glue/events_to_parquet.py'
      - 'infrastructure/cdk/stacks/glue_etl_stack.py'
      - 'backend/tests/unit/schemas/test_etl_schemas.py'
      - 'backend/tests/unit/services/test_etl_service.py'
      - 'backend/tests/unit/api/test_etl_endpoints.py'
  pull_request:
    paths:
      - 'backend/app/**'
      - 'backend/lambda/glue/**'
      - 'infrastructure/cdk/stacks/glue_etl_stack.py'
  workflow_dispatch:

jobs:
  test:
    name: Run ETL unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run ETL schema tests
        env:
          APP_ENV: test
          TESTING: "true"
        run: |
          python -m pytest \
            backend/tests/unit/schemas/test_etl_schemas.py \
            -v --tb=short

      - name: Run ETL service tests (mocked AWS via moto)
        env:
          APP_ENV: test
          TESTING: "true"
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: |
          python -m pytest \
            backend/tests/unit/services/test_etl_service.py \
            -v --tb=short

      - name: Run ETL API endpoint tests
        env:
          APP_ENV: test
          TESTING: "true"
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: |
          python -m pytest \
            backend/tests/unit/api/test_etl_endpoints.py \
            -v --tb=short

      - name: Run all ETL tests together with coverage
        env:
          APP_ENV: test
          TESTING: "true"
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: |
          mkdir -p test-results
          python -m pytest \
            backend/tests/unit/schemas/test_etl_schemas.py \
            backend/tests/unit/services/test_etl_service.py \
            backend/tests/unit/api/test_etl_endpoints.py \
            -v --tb=short \
            --junit-xml=test-results/etl-tests.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etl-test-results
          path: test-results/
          retention-days: 7
