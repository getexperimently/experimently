name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
      - 'requirements*.txt'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
      - 'requirements*.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.11"]

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: experimentation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}-${{ matrix.python-version }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-cov pytest-xdist pytest-env
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        # Install package in development mode
        pip install -e .

    - name: Create schema
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d experimentation_test -c "CREATE SCHEMA IF NOT EXISTS experimentation;"

    - name: Run tests
      env:
        # Models resolve their schema from APP_ENV/TESTING at import time, so
        # these must be set before pytest starts (the conftest sets them too
        # late for that). The test conftest builds its own per-process
        # database from POSTGRES_*; it must not be pointed elsewhere.
        APP_ENV: test
        TESTING: "true"
        POSTGRES_SERVER: localhost
        POSTGRES_PORT: 5432
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      # Runs sequentially (no xdist): every other workflow runs the suites in
      # a single process, and the parallel run never completed on CI.
      # backend/tests/realistic and backend/tests/performance need a running
      # platform (they are driven by nightly-qa / performance-tests), so only
      # the self-contained suites run here.
      run: |
        python -m pytest \
          backend/tests/unit \
          backend/tests/integration \
          backend/tests/smoke \
          backend/tests/contract \
          backend/tests/e2e \
          --cov=backend.app \
          --cov-report=xml \
          --cov-report=term \
          -q --tb=short \
          -o log_cli=false \
          --junitxml=pytest.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: pytest.xml

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v4
      if: always()
      with:
        report_paths: 'pytest.xml'
        check_name: Test Results - Python ${{ matrix.python-version }}
