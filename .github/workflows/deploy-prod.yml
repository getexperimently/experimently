name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Git tag or commit SHA to deploy (e.g. v1.2.3)'
        required: true
        type: string
      profile:
        # The profile a deployment gets is a decision, not a default. The image
        # used to be built `--target core` with nothing saying so, which on this
        # layout means an image with no modules/ directory at all: the modules'
        # registration never runs, `hooks.audit_signer` stays `NullAuditSigner`,
        # and every SOC 2 / ISO 27001 compliance audit event is written with
        # hmac_signature = NULL -- which `NullAuditSigner.verify()` then reports
        # as intact. Nothing else signals it (`/health/ready` is a cheerful 200
        # with `profile: core`), so the choice is made here, in the open.
        description: 'Image profile to build and deploy (full = modules included, signed compliance audit log)'
        required: true
        type: choice
        default: full
        options: [full, core]
      accept_unsigned_audit_log:
        # Required for `core` and only for `core`; see the guard in
        # pre-deployment-checks. A tick-box is the cheapest way to make
        # "unsigned" impossible to reach by accident while keeping it reachable
        # on purpose (a core-licensed deployment that never wanted the modules).
        description: 'core only: I accept an UNSIGNED compliance audit log (no HMAC, verify() reports unsigned rows as intact)'
        required: false
        type: boolean
        default: false
      skip_smoke_tests:
        description: 'Skip smoke tests (emergency deploys only)'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_BACKEND_REPO: experimentation-platform/backend
  ECS_CLUSTER: experimentation-prod
  ECS_BACKEND_SERVICE: experimentation-backend-prod
  # The task-definition FAMILY. It happens to spell the same as the
  # service today (both come from `experimentation-backend-{env}` in
  # fargate_service_stack.py) and they are different things -- #141
  # renames the deployed identifiers and could move one without the other.
  ECS_BACKEND_TASK_FAMILY: experimentation-backend-prod

jobs:
  pre-deployment-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    if: (github.repository == 'amarkanday/experimentation-platform' || github.repository == 'getexperimently/experimently') && vars.AWS_ACCOUNT_ID != ''
    permissions:
      id-token: write
      contents: read
      checks: read
    steps:
      # Before anything else, and before any AWS credential is issued: the
      # profile decides whether this deployment signs its compliance audit log.
      - name: Confirm the deployment profile
        env:
          PROFILE: ${{ inputs.profile }}
          ACCEPTED: ${{ inputs.accept_unsigned_audit_log }}
        run: |
          set -euo pipefail
          echo "Requested profile: ${PROFILE}"
          UNSIGNED="profile=core builds an image with no modules/, so the compliance module never registers: every SOC 2 / ISO 27001 audit event is written with hmac_signature = NULL and NullAuditSigner.verify() reports those rows as intact."
          if [ "${PROFILE}" = "core" ] && [ "${ACCEPTED}" != "true" ]; then
            echo "::error::${UNSIGNED} Re-run with accept_unsigned_audit_log=true if that is what you want, or deploy profile=full."
            exit 1
          fi
          {
            echo "### Deployment profile: \`${PROFILE}\`"
            echo ""
            if [ "${PROFILE}" = "core" ]; then
              echo ":warning: ${UNSIGNED}"
              echo ""
              echo "Acknowledged by @${GITHUB_ACTOR}."
            else
              echo "Modules included; compliance audit events are HMAC-signed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${PROFILE}" = "core" ]; then
            echo "::warning::${UNSIGNED} Acknowledged by ${GITHUB_ACTOR}."
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}

      - name: Validate deploy target is an existing git tag
        run: |
          git fetch --tags --force
          git rev-parse "refs/tags/${{ inputs.version }}" >/dev/null

      - name: Verify release gate passed for target commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA=$(git rev-parse HEAD)
          RELEASE_GATE_RESULT=$(gh api "repos/${{ github.repository }}/commits/${TARGET_SHA}/check-runs" \
            --jq '.check_runs[] | select(.name=="Release Gate Summary") | .conclusion' || true)

          if [ "${RELEASE_GATE_RESULT}" != "success" ]; then
            echo "::error::Release Gate Summary is not successful for ${TARGET_SHA}. Result='${RELEASE_GATE_RESULT}'"
            exit 1
          fi
          echo "Release gate verified for ${TARGET_SHA}"

      - name: Notify deployment started
        uses: slackapi/slack-github-action@v4.0.0
        with:
          channel-id: '#deployments'
          slack-message: |
            :rocket: *Production deployment starting*
            Version: `${{ inputs.version }}`
            Profile: `${{ inputs.profile }}`${{ inputs.profile == 'core' && ' :warning: unsigned compliance audit log' || '' }}
            Triggered by: ${{ github.actor }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      - name: Check no active incidents
        run: |
          echo "Checking for active incidents..."
          # In real usage: query PagerDuty/Statuspage API
          echo "No active incidents found - proceeding"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The task definitions inject these (infrastructure/cdk/stacks/
      # fargate_service_stack.py, migration_task_stack.py), and the image ships
      # no .env file: they are the only way the container gets a real value for
      # a setting whose default the production settings classes REFUSE. A
      # missing one is not a degraded deployment, it is a container that exits
      # before uvicorn binds -- discovered twenty minutes later as a CodeDeploy
      # timeout. One describe-secret each turns that into a name.
      - name: Required secrets exist for this profile
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          required=(db-password jwt-secret redis-url first-superuser-password)
          if [ "${PROFILE}" = "full" ]; then
            # Only the modules read it, and modules.register(hooks) builds
            # their settings first: without it the registration fails, the API
            # refuses to start (abort_if_modules_broken) and every alembic
            # command fails with it (require_modules_or_absent).
            required+=(audit-hmac-key)
          fi
          missing=()
          for name in "${required[@]}"; do
            aws secretsmanager describe-secret \
              --secret-id "/prod/experimentation/${name}" >/dev/null 2>&1 \
              || missing+=("/prod/experimentation/${name}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::profile=${PROFILE} needs these AWS Secrets Manager secrets and they do not exist: ${missing[*]}. Create them first: docs/deployment/secrets-management.md."
            exit 1
          fi
          echo "profile=${PROFILE}: all ${#required[@]} required secrets exist"

      # The prerequisite the build discovers five minutes later as an opaque
      # `docker push` failure. Nothing in the CDK creates this repository --
      # both stacks call `ecr.Repository.from_repository_name`, which imports
      # one -- so it is created once per account by hand, and for a long time
      # the documentation named a repository nothing used (#211). Checked
      # here, beside the other "does the thing we assume exists exist"
      # checks, so a missing prerequisite is named in seconds.
      - name: ECR repository exists
        run: |
          set -euo pipefail
          if ! aws ecr describe-repositories \
                --repository-names "${ECR_BACKEND_REPO}" >/dev/null 2>&1; then
            echo "::error::the ECR repository ${ECR_BACKEND_REPO} does not exist. Nothing in the CDK creates it; create it once per account -- docs/deployment/deployment-guide.md section 1.3."
            exit 1
          fi
          echo "ECR repository ${ECR_BACKEND_REPO} exists"

      - name: Verify backup exists
        run: |
          LATEST_BACKUP=$(aws rds describe-db-cluster-snapshots \
            --db-cluster-identifier experimentation-prod \
            --snapshot-type automated \
            --query 'sort_by(DBClusterSnapshots, &SnapshotCreateTime)[-1].DBClusterSnapshotIdentifier' \
            --output text 2>/dev/null || echo "NONE")

          if [ "$LATEST_BACKUP" = "NONE" ]; then
            echo "WARNING: No automated backup found. Taking manual snapshot..."
            aws rds create-db-cluster-snapshot \
              --db-cluster-identifier experimentation-prod \
              --db-cluster-snapshot-identifier "pre-deploy-$(date +%Y%m%d-%H%M%S)"
          else
            echo "Latest backup: $LATEST_BACKUP - proceeding"
          fi

  run-tests:
    name: Run Test Suite
    runs-on: ubuntu-latest
    if: (github.repository == 'amarkanday/experimentation-platform' || github.repository == 'getexperimently/experimently') && vars.AWS_ACCOUNT_ID != ''
    needs: pre-deployment-checks
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: experimentation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r backend/requirements.txt

      - name: Run unit tests
        run: |
          source venv/bin/activate
          export APP_ENV=test TESTING=true
          python -m pytest backend/tests/unit/ -v --tb=short -q

      - name: Run integration tests
        run: |
          source venv/bin/activate
          export APP_ENV=test TESTING=true \
            POSTGRES_SERVER=localhost POSTGRES_USER=postgres \
            POSTGRES_PASSWORD=postgres POSTGRES_DB=experimentation_test \
            POSTGRES_SCHEMA=experimentation_test
          python -m pytest backend/tests/integration/database/ -v -q
          python -m pytest backend/tests/integration/api/ -v -q

  build-and-push:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    if: (github.repository == 'amarkanday/experimentation-platform' || github.repository == 'getexperimently/experimently') && vars.AWS_ACCOUNT_ID != ''
    needs: run-tests
    permissions:
      id-token: write
      contents: read
    outputs:
      backend-image: ${{ steps.build-backend.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        id: build-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ inputs.version }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          # Build context is the repository root (the code imports backend.app.*).
          # --target is the requested profile, never a hard-coded default: see
          # the `profile` input and the guard in pre-deployment-checks.
          # VERSION is what the image labels itself with
          # (org.opencontainers.image.version) and what
          # docs/self-hosting/releases.md tells an operator to read off a
          # running container. Without it the Dockerfile's placeholder default
          # applies and every production image says 0.0.0+unknown while
          # /health reports the real number from /app/VERSION -- the two
          # version surfaces disagreeing on the only images that matter.
          docker build \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            --build-arg VERSION="${IMAGE_TAG#v}" \
            --target "$PROFILE" \
            -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG-$PROFILE \
            -t $ECR_REGISTRY/$ECR_BACKEND_REPO:latest \
            -f backend/Dockerfile \
            .
          # The image labels itself (backend/Dockerfile's `core` and `full`
          # stages each set io.experimently.profile). Fail here rather than
          # discover in production that the tag and the contents disagree.
          BUILT=$(docker inspect --format '{{index .Config.Labels "io.experimently.profile"}}' \
            "$ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG")
          if [ "$BUILT" != "$PROFILE" ]; then
            echo "::error::requested profile '$PROFILE' but the image is labelled '$BUILT'"
            exit 1
          fi
          echo "Backend image profile: $BUILT"
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG-$PROFILE
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:latest
          echo "image=$ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # The dashboard is NOT deployed from here (#195). What used to stand
      # here pushed to `experimentation-platform/frontend`, an ECR repository
      # nothing creates -- neither CDK stack creates any repository, both call
      # `ecr.Repository.from_repository_name`, which imports one assumed to
      # exist -- and ECR does not create a repository on push. Its
      # `frontend-image` output was never consumed either: the only output
      # read downstream is `backend-image`, in the `Update ECS task definition
      # with new image` step (`id: task-def`).
      #
      # The dashboard ships as a static Next.js export served by nginx,
      # published by release.yml as `<ghcr.io/owner/repo>-web` (the name is
      # derived from `github.repository`, so it tracks whatever the repository
      # is called). That is what docs/self-hosting/releases.md describes and
      # what docker-compose.yml runs. This half of the workflow predates that
      # decision.
      #
      # Intent, not a claim about the present: production has no dashboard
      # delivery path at all, and that is tracked, not fixed here (#212).

  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    if: (github.repository == 'amarkanday/experimentation-platform' || github.repository == 'getexperimently/experimently') && vars.AWS_ACCOUNT_ID != ''
    needs: build-and-push
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Take pre-migration DB snapshot
        run: |
          SNAPSHOT_ID="pre-migration-$(date +%Y%m%d-%H%M%S)"
          aws rds create-db-cluster-snapshot \
            --db-cluster-identifier experimentation-prod \
            --db-cluster-snapshot-identifier $SNAPSHOT_ID
          echo "SNAPSHOT_ID=$SNAPSHOT_ID" >> $GITHUB_ENV
          echo "Pre-migration snapshot: $SNAPSHOT_ID"

      - name: Run migrations via ECS task
        run: |
          # Run migration as a one-off ECS task.
          #
          # The command override is `backend.app.db.bootstrap`, not raw
          # `alembic upgrade heads`: the historical chain cannot be replayed
          # from an empty database, and this job runs BEFORE `deploy`, so on a
          # first deployment nothing has created the schema yet. It stays an
          # override rather than inheriting the task definition's command
          # because nothing in this workflow runs `cdk deploy`, so the
          # registered definition can be older than this repository.
          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition experimentation-migrate \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.PROD_PRIVATE_SUBNET_IDS }}],securityGroups=[${{ secrets.PROD_ECS_SG_ID }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["python","-m","backend.app.db.bootstrap"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task: $TASK_ARN"

          # Wait for completion
          aws ecs wait tasks-stopped --cluster $ECS_CLUSTER --tasks $TASK_ARN

          # Check exit code
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster $ECS_CLUSTER \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE"
            echo "Pre-migration snapshot available: $SNAPSHOT_ID"
            exit 1
          fi
          echo "Migration completed successfully"

  deploy:
    name: Deploy to Production (Blue/Green)
    runs-on: ubuntu-latest
    if: (github.repository == 'amarkanday/experimentation-platform' || github.repository == 'getexperimently/experimently') && vars.AWS_ACCOUNT_ID != ''
    needs: [build-and-push, run-migrations]
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS task definition with new image
        id: task-def
        env:
          # Never interpolate into the script body: `inputs.version` reaches
          # this string, and it is operator-supplied. A tag containing a quote
          # would close the Python literal below and run inside the job that
          # holds the production AWS role.
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend-image }}
        run: |
          set -euo pipefail

          # The FAMILY, deliberately, which resolves to its latest ACTIVE
          # revision. Two producers register into this family and the split is
          # the point of #82:
          #
          #   CloudFormation owns the shape  -- env, secrets, cpu/memory,
          #                                     roles, log configuration
          #   this workflow owns the image   -- and nothing else
          #
          # So the newest revision is the right base whoever wrote it: if
          # `cdk deploy` wrote it, this run picks up the new configuration and
          # corrects only the image; if the last run of this workflow wrote
          # it, the configuration is already CloudFormation's from the deploy
          # before. Basing on the *service* instead would freeze both --
          # `Service.taskDefinition` is "specified when the service is created
          # with CreateService, and it can be modified with UpdateService",
          # and UpdateService is exactly the call ECS refuses on a CODE_DEPLOY
          # service, so that field never moves off the revision
          # CloudFormation created. The revision actually serving traffic is
          # `taskSets[?status=='PRIMARY'].taskDefinition`; it is not used here
          # because it would discard every CloudFormation change.
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$ECS_BACKEND_TASK_FAMILY" \
            --query taskDefinition)

          # Update image in task definition
          NEW_TASK_DEF=$(echo $TASK_DEF | python3 -c "
          import json, os, sys
          td = json.load(sys.stdin)
          for c in td['containerDefinitions']:
              if c['name'] == 'backend':
                  c['image'] = os.environ['BACKEND_IMAGE']
          # Remove fields that can't be re-registered
          for key in ['taskDefinitionArn','revision','status','requiresAttributes',
                      'compatibilities','registeredAt','registeredBy']:
              td.pop(key, None)
          print(json.dumps(td))
          ")

          # Register new task definition
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "new-task-def=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "New task definition: $NEW_TASK_DEF_ARN"

      - name: Create CodeDeploy deployment (Blue/Green)
        id: codedeploy
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name experimentation-platform \
            --deployment-group-name experimentation-prod \
            --revision '{"revisionType":"AppSpecContent","appSpecContent":{"content":"{\"version\":1,\"Resources\":[{\"TargetService\":{\"Type\":\"AWS::ECS::Service\",\"Properties\":{\"TaskDefinition\":\"${{ steps.task-def.outputs.new-task-def }}\",\"LoadBalancerInfo\":{\"ContainerName\":\"backend\",\"ContainerPort\":8000}}}}]}"}}' \
            --query 'deploymentId' \
            --output text)
          echo "deployment-id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
          echo "Deployment ID: $DEPLOYMENT_ID"

      - name: Wait for deployment (10% traffic bake)
        run: |
          echo "Waiting for CodeDeploy deployment to reach 10% traffic..."
          # Wait up to 20 minutes for deployment to complete
          timeout 1200 aws deploy wait deployment-successful \
            --deployment-id ${{ steps.codedeploy.outputs.deployment-id }} || {
            echo "Deployment timed out or failed - triggering rollback"
            aws deploy stop-deployment \
              --deployment-id ${{ steps.codedeploy.outputs.deployment-id }} \
              --auto-rollback-enabled
            exit 1
          }

  smoke-tests:
    name: Post-deployment Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: (github.repository == 'amarkanday/experimentation-platform' || github.repository == 'getexperimently/experimently') && vars.AWS_ACCOUNT_ID != '' && (!inputs.skip_smoke_tests)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install requests pytest

      - name: Run smoke tests
        env:
          SMOKE_TEST_API_URL: ${{ secrets.PROD_API_URL }}
          SMOKE_TEST_API_KEY: ${{ secrets.PROD_SMOKE_TEST_API_KEY }}
          SMOKE_TEST_TOKEN: ${{ secrets.PROD_SMOKE_TEST_TOKEN }}
        run: |
          python -m pytest backend/tests/smoke/ -v --tb=short

  post-deployment:
    name: Post-deployment Verification
    runs-on: ubuntu-latest
    needs: [deploy, smoke-tests]
    if: (github.repository == 'amarkanday/experimentation-platform' || github.repository == 'getexperimently/experimently') && vars.AWS_ACCOUNT_ID != '' && (always())
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check ECS service health
        run: |
          RUNNING=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_BACKEND_SERVICE \
            --query 'services[0].runningCount' \
            --output text)
          DESIRED=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_BACKEND_SERVICE \
            --query 'services[0].desiredCount' \
            --output text)
          echo "Running: $RUNNING / Desired: $DESIRED"
          [ "$RUNNING" = "$DESIRED" ] && echo "Service healthy" || (echo "Service unhealthy" && exit 1)

      - name: Notify deployment result
        uses: slackapi/slack-github-action@v4.0.0
        with:
          channel-id: '#deployments'
          slack-message: |
            ${{ needs.smoke-tests.result == 'success' && ':white_check_mark:' || ':x:' }} *Production deployment ${{ needs.smoke-tests.result }}*
            Version: `${{ inputs.version }}`
            Deployed by: ${{ github.actor }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true
