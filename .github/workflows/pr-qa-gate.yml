name: PR QA Gate

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-qa-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          APP_ENV: test
          TESTING: 'true'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: python -m pytest backend/tests/unit/ -p no:cov -q --tb=short -x

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run smoke tests
        env:
          APP_ENV: test
          TESTING: 'true'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: python -m pytest backend/tests/smoke/ -p no:cov -q --tb=short

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run Jest tests
        run: cd frontend && npm test -- --passWithNoTests --watchAll=false

      - name: Build
        run: cd frontend && npm run build

  sdk-contracts:
    name: SDK Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install pytest
        run: pip install pytest

      # pytest.ini adds --cov flags; only pytest is installed here, so clear addopts.
      - name: Run Python contracts
        run: python -m pytest tests/sdk-contract/test_python_sdk.py -v -o addopts=""

      - name: Run JS contracts
        run: node tests/sdk-contract/test_js_sdk.js

  # Browser E2E tests need a seeded backend (the Playwright fixtures create
  # experiments through the real API), so they run in nightly-qa.yml where the
  # full stack is started, not in the PR gate.
