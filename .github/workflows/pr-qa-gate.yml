name: PR QA Gate

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-qa-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          APP_ENV: test
          TESTING: 'true'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: python -m pytest backend/tests/unit/ -p no:cov -q --tb=short -x

      # The Lambda functions (assignment, event processor, flag evaluation) carry
      # 301 tests of their own that ran nowhere in CI. Each function's tests/ dir
      # must run in its own pytest invocation (they all define `tests.conftest`).
      - name: Run Lambda tests
        run: |
          for d in backend/lambda/assignment backend/lambda/event_processor backend/lambda/feature_flag_evaluation backend/lambda/shared; do
            python -m pytest "$d" -p no:cov -q --tb=short || exit 1
          done

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run smoke tests
        env:
          APP_ENV: test
          TESTING: 'true'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: python -m pytest backend/tests/smoke/ -p no:cov -q --tb=short

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run Jest tests
        run: cd frontend && npm test -- --passWithNoTests --watchAll=false

      - name: Build
        run: cd frontend && npm run build

  sdk-contracts:
    name: SDK Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install pytest
        run: pip install pytest

      # pytest.ini adds --cov flags; only pytest is installed here, so clear addopts.
      - name: Run Python contracts
        run: python -m pytest tests/sdk-contract/test_python_sdk.py -v -o addopts=""

      - name: Run JS contracts
        run: node tests/sdk-contract/test_js_sdk.js

  # Live SDK contract: every SDK's contract_smoke against a real backend.
  # Proves the SDKs call endpoints the backend actually serves (the golden-vector
  # job above only covers hashing). Toolchains not available on ubuntu-latest
  # (Android, Flutter, Elixir, iOS) are exercised by their unit tests only.
  sdk-live-contract:
    name: SDK Live Contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: development
      ENVIRONMENT: development
      POSTGRES_SERVER: localhost
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: experimentation
      POSTGRES_SCHEMA: experimentation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SECRET_KEY: ci-only-sdk-live-contract-secret-key-0123456789abcdef
      EXPERIMENTLY_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: sdk/go/go.sum

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install OpenFeature Python SDK dependency
        run: pip install "openfeature-sdk>=0.9.0"

      - name: Install JS SDK dependencies
        run: |
          for d in sdk/js sdk/openfeature sdk/edge; do
            (cd "$d" && (npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund))
          done

      - name: Seed contract fixtures
        run: python backend/scripts/seed_sdk_contract.py

      - name: Start backend
        run: |
          nohup python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && exit 0
            sleep 1
          done
          echo "backend did not become healthy"; tail -n 100 backend.log; exit 1

      - name: Run live SDK contract
        run: >
          python tests/sdk-contract/live/run_live_contract.py --strict
          --sdk python --sdk openfeature-python
          --sdk js --sdk openfeature --sdk edge
          --sdk go --sdk java --sdk ruby --sdk php --sdk dotnet

      - name: Backend log (on failure)
        if: failure()
        run: tail -n 200 backend.log

  # Browser E2E tests need a seeded backend (the Playwright fixtures create
  # experiments through the real API), so they run in nightly-qa.yml where the
  # full stack is started, not in the PR gate.

  # Builds both images and boots the compose stack exactly the way a
  # self-hoster does, then walks the golden path through the real containers:
  # readiness -> login -> user API key -> SDK assignment -> dashboard pages
  # (including a dynamic route served by nginx from the static export).
  docker-smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SEED: demo,sdk-contract
      AUTH_PROVIDER: local
      DEV_AUTH_BYPASS: "false"
      ENVIRONMENT: development
      SECRET_KEY: ci-only-docker-smoke-secret-key-0123456789abcdef0123456789
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: ce
          load: true
          tags: experimently-api:ce
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: experimently-web:ce
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Start the stack
        run: docker compose -f docker-compose.yml up -d --wait --no-build postgres redis api frontend

      - name: API readiness and auth gate
        run: |
          curl -sf localhost:8000/health/ready -o ready.json
          cat ready.json
          grep -q '"status":"healthy"' ready.json
          curl -sf localhost:8000/health/live >/dev/null
          # /api/v1/experiments 307-redirects to the trailing-slash route; follow it.
          code=$(curl -sL -o /dev/null -w '%{http_code}' localhost:8000/api/v1/experiments)
          test "$code" = "401" || { echo "expected 401 without credentials, got $code"; exit 1; }

      - name: Login, create an API key, assign a user (sdk_contract_ab)
        run: |
          set -euo pipefail
          TOKEN=$(curl -sf -X POST localhost:8000/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"admin@demo.com","password":"Demo1234!"}' | jq -er .access_token)
          curl -sf localhost:8000/api/v1/auth/me -H "Authorization: Bearer $TOKEN" | jq -e '.role == "ADMIN"' >/dev/null
          KEY=$(curl -sf -X POST localhost:8000/api/v1/api-keys \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"name":"docker-smoke"}' | jq -er .key)
          curl -sf -X POST localhost:8000/api/v1/tracking/assign \
            -H "X-API-Key: $KEY" -H 'content-type: application/json' \
            -d '{"experiment_key":"sdk_contract_ab","user_id":"docker-smoke-user"}' \
            | tee /dev/stderr | jq -e '.variant_id' >/dev/null

      - name: Dashboard through nginx
        run: |
          set -euo pipefail
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/login)" = "200"
          # Fetch to files: piping curl into `grep -q` makes curl exit 23
          # (SIGPIPE) once grep stops reading, which `pipefail` turns into a
          # step failure for any page larger than the pipe buffer.
          curl -s localhost:3000/results/abc -o results.html
          curl -s localhost:3000/docs/quick-start -o quick-start.html
          # dynamic route: the results page html, not the login page / 404
          grep -q '"page":"/results/\[id\]"' results.html
          # in-app docs were rendered from docs/*.md at build time
          grep -q '<h1>Quick Start' quick-start.html
          ! grep -q 'Documentation coming soon' quick-start.html
          # /api and /health are proxied to the api container
          curl -sf localhost:3000/health/ready >/dev/null
          test "$(curl -sL -o /dev/null -w '%{http_code}' localhost:3000/api/v1/experiments/)" = "401"

      - name: Container logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v --remove-orphans
