name: Performance Tests

on:
  workflow_dispatch:
    inputs:
      users:
        description: 'Concurrent users'
        default: '100'
        required: false
      duration:
        description: 'Test duration (e.g. 120s, 5m)'
        default: '120s'
        required: false
      host:
        description: 'Target host (leave blank to start local server)'
        default: 'http://localhost:8000'
        required: false
      test_type:
        description: 'Test type to run'
        default: 'baseline'
        required: false
        type: choice
        options:
          - baseline
          - spike
          - endurance
          - crud
          - db_stress
          - breakpoint
  schedule:
    # Run weekly on Monday at 02:00 UTC
    - cron: '0 2 * * 1'

jobs:
  load-test:
    name: Run ${{ github.event.inputs.test_type || 'baseline' }} load test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Database connection
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: experimentation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SCHEMA: experimentation
      # Redis connection
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # Application environment
      APP_ENV: test
      TESTING: 'true'
      SECRET_KEY: ci-load-test-secret-key-not-for-production
      # AWS mocking (not needed for load tests but prevents import errors)
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run database migrations
        working-directory: backend
        run: |
          python -m alembic -c app/db/alembic.ini upgrade head
        env:
          POSTGRES_HOST: localhost

      - name: Start API server
        working-directory: backend
        run: |
          python -m uvicorn backend.app.main:app \
            --host 0.0.0.0 \
            --port 8000 \
            --log-level warning &
          echo "API server PID: $!"
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "Server ready after ${i}s"
              break
            fi
            echo "Waiting for server... (${i}/30)"
            sleep 1
          done
          curl -f http://localhost:8000/health || (echo "Server failed to start" && exit 1)
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Determine locustfile path
        id: locustfile
        run: |
          TEST_TYPE="${{ github.event.inputs.test_type || 'baseline' }}"
          case "$TEST_TYPE" in
            baseline)   FILE="backend/tests/performance/locustfiles/api_load_test.py" ;;
            spike)      FILE="backend/tests/performance/locustfiles/spike_test.py" ;;
            endurance)  FILE="backend/tests/performance/locustfiles/endurance_test.py" ;;
            crud)       FILE="backend/tests/performance/locustfiles/crud_load_test.py" ;;
            db_stress)  FILE="backend/tests/performance/locustfiles/db_stress_test.py" ;;
            breakpoint) FILE="backend/tests/performance/locustfiles/breakpoint_test.py" ;;
            *)          FILE="backend/tests/performance/locustfiles/api_load_test.py" ;;
          esac
          echo "locustfile=$FILE" >> "$GITHUB_OUTPUT"
          echo "Using locustfile: $FILE"

      - name: Run load tests
        working-directory: ${{ github.workspace }}
        run: |
          python backend/tests/performance/run_load_tests.py \
            --host "${{ github.event.inputs.host || 'http://localhost:8000' }}" \
            --users "${{ github.event.inputs.users || '50' }}" \
            --spawn-rate 10 \
            --duration "${{ github.event.inputs.duration || '60s' }}" \
            --locustfile "${{ steps.locustfile.outputs.locustfile }}" \
            --csv-prefix /tmp/locust_results
        env:
          PYTHONPATH: ${{ github.workspace }}
          LOAD_TEST_API_KEY: test-api-key

      - name: Upload Locust CSV results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-results-${{ github.event.inputs.test_type || 'baseline' }}-${{ github.run_number }}
          path: /tmp/locust_*.csv
          retention-days: 30

      - name: Upload Locust history CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-history-${{ github.event.inputs.test_type || 'baseline' }}-${{ github.run_number }}
          path: /tmp/locust_*_history.csv
          if-no-files-found: ignore
          retention-days: 30
