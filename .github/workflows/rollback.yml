name: Rollback
# No revision in the run name: an ARN names the account, and a run name is
# public and is never masked. The run's summary names the revision.
run-name: Rollback ${{ inputs.environment }}

# Puts a previous, released revision of the API back into service through
# CodeDeploy, for either environment (DECISIONS D6), and -- when
# dashboard_task_definition_arn is given -- the dashboard's too, through its
# own rolling deployment (#69). A deploy's run summary prints the line to
# paste: environment=<env>, task_definition_arn=<family:n>[,
# dashboard_task_definition_arn=<family:n>]. There is no dashboard-only path
# here, because the stop step below reverts any in-flight API deployment
# (runbook Method 2 is the dashboard-only path). The API half refuses, and the
# run fails, in two cases (#148): the API is already on the target with
# nothing in flight (nothing to roll back; the dashboard half still runs), and
# an in-flight deployment is CodeDeploy's own rollback (nothing is stopped or
# rolled). docs/deployment/rollback-runbook.md is the procedure around it.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to roll back'
        required: true
        type: choice
        default: staging
        options: [staging, prod]
      task_definition_arn:
        description: 'Revision to roll back to: an ARN, or family:revision (e.g. experimentation-backend-<environment>:42). A deploy run summary prints it.'
        required: true
        type: string
      dashboard_task_definition_arn:
        description: 'Dashboard revision to roll back to, family:revision (e.g. experimentation-dashboard-<environment>:7). Leave empty to leave the dashboard as it is. A deploy run summary prints it.'
        required: false
        type: string
        default: ''
      reason:
        description: 'Reason for rollback'
        required: true
        type: string

# Its own group, NOT the deploy's: a rollback must never wait behind -- or be
# replaced in the queue by -- a deploy of the release it is undoing. It stops
# any CodeDeploy deployment in flight itself (below).
concurrency:
  group: rollback-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  # An upper bound on the whole rollback, not an assertion about how long one
  # takes. The deployment group's own waits are 30 minutes for approval and an
  # hour before the blue task set is terminated (fargate_service_stack.py), so
  # any ceiling shorter than those fails a rollback that is working. This job
  # does not sit through either: it calls ContinueDeployment as soon as the
  # deployment is Ready, and it stops waiting once traffic is on the target
  # rather than waiting for CodeDeploy to finish tidying up behind it.
  ROLLBACK_TIMEOUT_SECONDS: '1800'
  # The dashboard's rolling deployment, as in deploy.yml.
  DASHBOARD_ROLLOUT_DEADLINE_SECONDS: '1200'
  DASHBOARD_ROLLOUT_POLL_SECONDS: '15'

jobs:
  rollback:
    name: Roll back ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # The job's waits are ROLLBACK_TIMEOUT_SECONDS (1800) and
    # DASHBOARD_ROLLOUT_DEADLINE_SECONDS (1200), about 55 minutes with the
    # rest; the default of 360 would outlive the AWS session.
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      TARGET_ENV: ${{ inputs.environment }}
      # The CDK's names; infrastructure/tests/test_workflow_names_exist.py
      # checks each against a synth of that environment.
      ECS_CLUSTER: experimentation-${{ inputs.environment }}
      ECS_BACKEND_SERVICE: experimentation-backend-${{ inputs.environment }}
      # The task-definition FAMILY. It spells the same as the service and is a
      # different thing.
      ECS_BACKEND_TASK_FAMILY: experimentation-backend-${{ inputs.environment }}
      # The dashboard's rolling-update service and its family (#69).
      ECS_DASHBOARD_SERVICE: experimentation-dashboard-${{ inputs.environment }}
      ECS_DASHBOARD_TASK_FAMILY: experimentation-dashboard-${{ inputs.environment }}
      CODEDEPLOY_APPLICATION: experimentation-platform-${{ inputs.environment }}
      CODEDEPLOY_DEPLOYMENT_GROUP: experimentation-${{ inputs.environment }}
    steps:
      # FIRST, and the only place the account ID is read (PE v1 C9). It is an
      # environment SECRET, never a variable: a step's log header prints its
      # evaluated `env:` before the step runs, so a variable's value would be
      # public before anything could mask it; a secret is masked from the
      # start of the job.
      - name: Refuse an environment that is not configured
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ROLE_ARN_SET: ${{ secrets.AWS_ROLE_ARN != '' }}
        run: |
          set -euo pipefail
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error title=Not configured::secrets.AWS_ACCOUNT_ID is not set for the '${TARGET_ENV}' environment, so nothing was rolled back. Set it as an environment secret under Settings → Environments → ${TARGET_ENV} → Environment secrets (gh secret set AWS_ACCOUNT_ID --env ${TARGET_ENV}); a variable of that name is not read. See docs/deployment/README.md#before-the-first-deploy"
            exit 1
          fi
          if ! [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error title=Not configured::secrets.AWS_ACCOUNT_ID for the '${TARGET_ENV}' environment is not a 12-digit AWS account id, so nothing was rolled back. See docs/deployment/README.md#before-the-first-deploy"
            exit 1
          fi
          if [ "$ROLE_ARN_SET" != "true" ]; then
            echo "::error title=Not configured::secrets.AWS_ROLE_ARN is not set for the '${TARGET_ENV}' environment, so nothing was rolled back. Set it under Settings → Environments → ${TARGET_ENV} → Secrets. See docs/deployment/README.md#before-the-first-deploy"
            exit 1
          fi
          echo "EXPECTED_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Refuse a dispatch from any ref but main
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (\"Use workflow from\"); you chose ${REF_NAME}. The revision to roll back to is the 'task_definition_arn' input."
            exit 1
          fi

      # The tooling (scripts/), from main: the dashboard's check and rollout
      # are scripts. Nothing else is checked out.
      - name: Check out the rollback tooling (main)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # timeout-minutes x 60 <= this <= the role's MaxSessionDuration (10800);
          # test_aws_session_duration.py. The default, 3600, expires mid-job.
          role-duration-seconds: 5400
          # The ASSUMED account, which the wrong-account check below may find
          # is not the configured one; the configured one is a secret already.
          mask-aws-account-id: true

      # Neither account ID is printed: the log is public.
      - name: Refuse the wrong AWS account
        id: account
        run: |
          set -euo pipefail
          actual="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$actual" != "$EXPECTED_ACCOUNT_ID" ]; then
            echo "::error title=Wrong AWS account::environment=${TARGET_ENV}: the assumed role is not in the account in this environment's AWS_ACCOUNT_ID secret. Check that its AWS_ROLE_ARN secret names a role in that account. Nothing has been rolled back."
            exit 1
          fi

      # The revisions as family:revision, for the Slack steps below. A `uses:`
      # step's log header prints its resolved `with:` values, and a full ARN --
      # a valid input -- names the account. `always()`: the result
      # notification reads these even when an earlier step failed.
      - name: Name the revisions without the account
        id: shown
        if: always()
        env:
          TARGET: ${{ inputs.task_definition_arn }}
          DASHBOARD_TARGET: ${{ inputs.dashboard_task_definition_arn }}
        run: |
          set -euo pipefail
          target="${TARGET##*/}"
          dashboard="${DASHBOARD_TARGET##*/}"
          {
            echo "target=${target//[$'\r\n']/ }"
            echo "dashboard=${dashboard//[$'\r\n']/ }"
          } >> "$GITHUB_OUTPUT"

      - name: Notify rollback started
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: '#deployments'
          slack-message: |
            *${{ inputs.environment }} ROLLBACK initiated* (warning)
            Reason: ${{ inputs.reason }}
            Rolling back to: `${{ steps.shown.outputs.target }}`
            Dashboard: `${{ steps.shown.outputs.dashboard || 'left as it is' }}`
            Triggered by: ${{ github.actor }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      # ECS refuses a task-definition change through UpdateService on a
      # service with a CODE_DEPLOY deployment controller -- "Unable to update
      # task definition on services with a CODE_DEPLOY deployment controller"
      # -- and `fargate_service_stack.py` creates this service with exactly
      # that controller. Rolling a CodeDeploy-controlled service back means
      # creating a deployment that names the older revision, which is the same
      # call `deploy.yml` makes to go forward.
      - name: Check the target revision is one we can roll onto
        id: target
        env:
          TARGET: ${{ inputs.task_definition_arn }}
        run: |
          set -euo pipefail

          # The input may be a full ARN: what this step prints is its last part.
          shown_target="${TARGET##*/}"
          TD="$(aws ecs describe-task-definition --task-definition "$TARGET" \
                  --query taskDefinition --output json)"

          # The RESOLVED arn, and everything downstream uses it. The input is
          # allowed to be `family:revision` or even a bare family, both of
          # which `describe-task-definition` accepts; comparing the raw input
          # against what ECS reports serving later would then fail a rollback
          # that worked. A bare family is worse than cosmetic -- it resolves to
          # the newest ACTIVE revision, which during an incident is quite
          # likely the revision being rolled back FROM -- so it is refused.
          ARN="$(jq -r '.taskDefinitionArn' <<<"$TD")"
          case "$TARGET" in
            *:[0-9]*) ;;
            *) echo "::error::$shown_target names a family with no revision. It would resolve to the newest ACTIVE revision, which during an incident may be the one you are rolling back from. Pass ${ARN##*/} instead." ; exit 1 ;;
          esac
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

          status="$(jq -r '.status' <<<"$TD")"
          if [ "$status" != "ACTIVE" ]; then
            echo "::error::${ARN##*/} is $status, not ACTIVE. A deregistered revision cannot be deployed."
            exit 1
          fi

          family="$(jq -r '.family' <<<"$TD")"
          if [ "$family" != "$ECS_BACKEND_TASK_FAMILY" ]; then
            other="${family#experimentation-backend-}"
            dashboard_env="${family#experimentation-dashboard-}"
            if [ "$family" = "$ECS_DASHBOARD_TASK_FAMILY" ]; then
              echo "::error::${ARN##*/} is a dashboard revision; it goes in dashboard_task_definition_arn, not task_definition_arn. Nothing has been rolled back."
            elif [ "$dashboard_env" != "$family" ]; then
              echo "::error::You chose environment=${TARGET_ENV} but ${ARN##*/} is a ${dashboard_env} dashboard revision; it goes in dashboard_task_definition_arn, not task_definition_arn. Re-run with environment=${dashboard_env}. Nothing has been rolled back."
            elif [ "$other" != "$family" ]; then
              echo "::error::You chose environment=${TARGET_ENV} but ${ARN##*/} is a ${other} revision. Re-run with environment=${other}."
            else
              echo "::error::${ARN##*/} belongs to family $family, not $ECS_BACKEND_TASK_FAMILY."
            fi
            exit 1
          fi

          # Two producers register into this family. CloudFormation's
          # revisions carry the CDK's `bootstrap` image, which is a tag the
          # deploy workflow never writes and which may not exist in ECR at
          # all -- rolling onto one starts tasks that cannot pull (#82).
          #
          # `select(...)` emits NOTHING and exits 0 when no container is named
          # `backend`, so an empty result has to be its own failure: the
          # AppSpec below hardcodes `ContainerName: backend`, and a revision
          # without one fails the CodeDeploy deployment mid-incident after
          # this guard has said the target is fine.
          image="$(jq -r '.containerDefinitions[] | select(.name=="backend") | .image' <<<"$TD")"
          if [ -z "$image" ]; then
            echo "::error::${ARN##*/} has no container named 'backend' (it has: $(jq -r '[.containerDefinitions[].name] | join(", ")' <<<"$TD")). The AppSpec this job builds names that container."
            exit 1
          fi
          case "$image" in
            *:bootstrap)
              echo "::error::${ARN##*/} runs ${image#*/} -- that is a CloudFormation-registered revision, not a released one. Pick a revision a deploy registered (its image is a digest, repo@sha256:...); docs/deployment/rollback-runbook.md Step 1 lists them with their images."
              exit 1
              ;;
          esac
          echo "rolling back to ${ARN##*/} (${image#*/})"

      # The dashboard's half, validated before anything changes, by the same
      # predicate the deploy summary used to print it: a release is a digest
      # (scripts/dashboard_revision.py). Also records the dashboard's PRIMARY
      # now, which the rollout below refuses to replace if it has changed.
      # Given empty, it records only what the dashboard is serving, so the
      # summary can say so.
      - name: Check the dashboard revision
        id: dashboard-target
        env:
          DASHBOARD_TARGET: ${{ inputs.dashboard_task_definition_arn }}
        run: |
          set -euo pipefail
          if [ -z "$DASHBOARD_TARGET" ]; then
            echo "no dashboard revision given: the dashboard is left as it is"
            # Read-only, for the summary; under its own output names, so it
            # cannot be mistaken for a target.
            if python3 scripts/dashboard_revision.py serving \
                 --cluster "$ECS_CLUSTER" --service "$ECS_DASHBOARD_SERVICE" \
                 --github-output serving.out; then
              sed 's/^/serving_/' serving.out >> "$GITHUB_OUTPUT"
            else
              echo "(could not read what the dashboard is serving)"
            fi
            exit 0
          fi
          python3 scripts/dashboard_revision.py target \
            --cluster "$ECS_CLUSTER" --service "$ECS_DASHBOARD_SERVICE" \
            --family "$ECS_DASHBOARD_TASK_FAMILY" --api-family "$ECS_BACKEND_TASK_FAMILY" \
            --github-output "$GITHUB_OUTPUT" "$DASHBOARD_TARGET"

      # CodeDeploy refuses a second deployment for a deployment group while one
      # is in flight, and during an incident one usually IS: the bad deploy
      # that caused this is itself a CodeDeploy deployment, and with a
      # 30-minute approval wait and an hour of termination wait it is still
      # running minutes later. Without this the rollback died at its first AWS
      # call, after the "ROLLBACK initiated" message had gone out.
      #
      # Before it writes anything, this step refuses in two cases (#148):
      # - Nothing is in flight and the target is already serving: already the
      #   PRIMARY task set, with the /api/* rule forwarding to its target group
      #   (scripts/api_serving.py exits 0). There is nothing to roll back, and
      #   a deployment created now would report success on its first poll and
      #   then wait, unapproved, for 30 minutes. The step sets
      #   `already_serving`: the CodeDeploy steps are skipped, the dashboard
      #   half still runs, and "Refuse a rollback to the revision already
      #   serving" fails the run.
      # - An in-flight deployment is CodeDeploy's own rollback
      #   (`creator == codeDeployRollback`). Stopping it with auto-rollback
      #   would put back the release it is rolling away from. Every in-flight
      #   deployment is classified by creator BEFORE any is stopped, and if
      #   any is CodeDeploy's rollback, or any creator cannot be read, nothing
      #   is stopped and the step fails.
      - name: Stop any deployment already in flight
        id: stop
        env:
          TARGET_ARN: ${{ steps.target.outputs.arn }}
        run: |
          set -euo pipefail
          # Every non-final status, the same set as scripts/refuse_active_deployment.py's
          # ACTIVE (a test pins them equal). Baking included: whether the hour the
          # group keeps the old task set reports InProgress or Baking is unobserved,
          # and that hour is when a rollback is most likely (PE B3b C2).
          # No --max-items, --page-size or --no-paginate: the CLI then pages
          # list-deployments itself and prints every page merged (a test pins it).
          IN_FLIGHT="$(aws deploy list-deployments \
            --application-name "$CODEDEPLOY_APPLICATION" \
            --deployment-group-name "$CODEDEPLOY_DEPLOYMENT_GROUP" \
            --include-only-statuses Created Queued InProgress Baking Ready \
            --query 'deployments' --output text)"

          if [ -z "$IN_FLIGHT" ] || [ "$IN_FLIGHT" = "None" ]; then
            echo "no deployment in flight"
            serving=0
            python3 scripts/api_serving.py "$ECS_CLUSTER" "$ECS_BACKEND_SERVICE" "$TARGET_ARN" || serving=$?
            case "$serving" in
              0)
                echo "the API is already on ${TARGET_ARN##*/}: this run creates no deployment and stops nothing"
                echo "already_serving=true" >> "$GITHUB_OUTPUT"
                ;;
              1) echo "the API is not on ${TARGET_ARN##*/}: rolling back" ;;
              *) echo "::warning title=Could not tell what the API is serving::scripts/api_serving.py exited ${serving} (its reason is above). Rolling back as if the API were not on ${TARGET_ARN##*/}: this run succeeds only once it has approved its own deployment and ${TARGET_ARN##*/} is the PRIMARY task set." ;;
            esac
            exit 0
          fi

          # Classify every in-flight deployment before stopping any of them.
          # One read per id: its creator and, for a CodeDeploy rollback, the
          # deployment it is rolling back. A failed read leaves the line empty,
          # and an empty or null creator is "could not tell", which stops
          # nothing (fail closed).
          unreadable=""
          rollbacks=""
          for id in $IN_FLIGHT; do
            line=""
            line="$(aws deploy get-deployment --deployment-id "$id" \
                      --query 'deploymentInfo.[creator, rollbackInfo.rollbackTriggeringDeploymentId]' \
                      --output text)" || line=""
            read -r creator of <<<"$line" || true
            case "${creator:-}" in
              ""|None|null)
                echo "::error title=Could not classify an in-flight deployment::The creator of CodeDeploy deployment ${id} could not be read, so this run cannot tell whether it is CodeDeploy's own rollback. It stopped nothing and rolled nothing back."
                unreadable="$unreadable $id"
                ;;
              codeDeployRollback)
                rollbacks="$rollbacks ${id}:${of:-None}"
                ;;
              *) echo "in-flight deployment $id was created by $creator" ;;
            esac
          done

          if [ -n "$rollbacks" ]; then
            primary="$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" --services "$ECS_BACKEND_SERVICE" \
              --query "services[0].taskSets[?status=='PRIMARY'].taskDefinition | [0]" \
              --output text)" || primary=""
            primary="${primary##*/}"
            primary="${primary:-a revision this run could not read}"
            ids=""
            for pair in $rollbacks; do
              id="${pair%%:*}"
              of="${pair#*:}"
              case "$of" in
                ""|None|null) of="an earlier deployment" ;;
              esac
              ids="${ids:+$ids }$id"
              echo "::error title=CodeDeploy is already rolling back::Deployment ${id} is CodeDeploy's own rollback of ${of} and is still active. Stopping it would put that release back, so this run stopped nothing and rolled nothing back. The API is on ${primary}. Rollback refuses while CodeDeploy's rollback is active, which can be up to an hour. For the dashboard alone: docs/deployment/rollback-runbook.md Method 2."
            done
            {
              echo "refused=codeDeployRollback"
              echo "refused_id=${ids}"
              echo "primary=${primary}"
            } >> "$GITHUB_OUTPUT"
          elif [ -n "$unreadable" ]; then
            {
              echo "refused=unreadable"
              echo "refused_id=${unreadable# }"
            } >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$unreadable$rollbacks" ]; then
            exit 1
          fi

          # The check-then-stop race, accepted (#148 PE condition 3(e)): the
          # classification above and the stops below are separate calls.
          # - A listed deployment can end in between; stop-deployment on it
          #   is then expected to fail, and set -e fails this step loudly.
          # - CodeDeploy can start a rollback deployment of its own in
          #   between. It is not in IN_FLIGHT, so nothing here stops it; the
          #   create-deployment below then fails because the group is busy.
          # Neither lets this step stop a codeDeployRollback deployment.
          for id in $IN_FLIGHT; do
            echo "stopping in-flight deployment $id"
            # --auto-rollback-enabled so stopping it reverts its own traffic
            # shift rather than leaving the group half-shifted.
            aws deploy stop-deployment --deployment-id "$id" --auto-rollback-enabled
          done

          # A failed read is "could not read, read again on the next poll"
          # (#215), never a status; READ_FAILURE_LIMIT in a row (about a
          # minute) fails the step, labelled, before anything is created.
          READ_FAILURE_LIMIT=12
          # 60 polls 5 s apart: a stopped deployment has about five minutes to
          # reach a final status. One that has not is NOT waited past (#225):
          # the step fails, labelled, before anything is created, rather than
          # leaving create-deployment to meet a group that is still busy.
          STOP_WAIT_POLLS=60
          aws_errors="$(mktemp)"
          trap 'rm -f "$aws_errors"' EXIT
          # Free text from AWS (an AccessDenied names the role's ARN) loses
          # every run of twelve digits before it is printed: the log is public.
          scrub() {
            sed -E 's/(^|[^0-9A-Za-z])[0-9]{12}([^0-9A-Za-z]|$)/\1<account>\2/g'
          }
          for id in $IN_FLIGHT; do
            read_failures=0
            finished=""
            last_status="(never read)"
            for _ in $(seq 1 "$STOP_WAIT_POLLS"); do
              if st="$(aws deploy get-deployment --deployment-id "$id" \
                         --query deploymentInfo.status --output text 2>"$aws_errors")"; then
                read_failures=0
                last_status="${st:0:40}"
                case "$st" in
                  Stopped|Succeeded|Failed) echo "$id is $st"; finished="$st"; break ;;
                esac
              else
                read_failures=$(( read_failures + 1 ))
                last_error="$(<"$aws_errors")"
                last_error="${last_error//$'\n'/ }"
                last_error="${last_error:0:200}"
                last_error="$(scrub <<<"$last_error")"
                echo "could not read from AWS (${last_error:-no error text}); reading again on the next poll"
                if [ "$read_failures" -ge "$READ_FAILURE_LIMIT" ]; then
                  echo "::error title=Rollback could not read AWS::${read_failures} reads in a row of deployment ${id} failed after this run stopped it with auto-rollback, so this run created no rollback deployment. The last AWS error: ${last_error:-no error text}. Check it by hand: aws deploy get-deployment --deployment-id ${id}"
                  exit 1
                fi
              fi
              sleep 5
            done
            if [ -z "$finished" ]; then
              echo "::error title=Stopped deployment did not finish::Deployment ${id} was stopped by this run with auto-rollback, but after ${STOP_WAIT_POLLS} polls (about 5 minutes) its last status read was ${last_status}, not Stopped, Succeeded or Failed. While it is active the deployment group is busy, so this run created no rollback deployment. Check it by hand: aws deploy get-deployment --deployment-id ${id}"
              exit 1
            fi
          done

      - name: Roll back via CodeDeploy
        id: codedeploy
        # Skipped when the API is already on the target with nothing in
        # flight: a deployment created then has nothing to do (#148).
        if: steps.stop.outputs.already_serving != 'true'
        env:
          TARGET_ARN: ${{ steps.target.outputs.arn }}
          # Never interpolate an operator-supplied string into the script body:
          # `${{ inputs.reason }}` is substituted by Actions before bash parses
          # the line, so `$(...)` inside it runs with this job's AWS
          # credentials. deploy.yml and db-migrate.yml follow the same rule.
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          APPSPEC="$(jq -cn --arg td "$TARGET_ARN" '{
            version: 1,
            Resources: [{
              TargetService: {
                Type: "AWS::ECS::Service",
                Properties: {
                  TaskDefinition: $td,
                  LoadBalancerInfo: { ContainerName: "backend", ContainerPort: 8000 }
                }
              }
            }]
          }')"
          # CodeDeployDefault.ECSAllAtOnce, not the group's configured
          # CANARY_10_PERCENT_15_MINUTES. The canary is right going forward, on
          # a revision nobody has run. Rolling back, the target was serving
          # minutes ago and the version being replaced is the one hurting
          # users -- a canary would leave 90% of traffic on it for another
          # fifteen minutes, against a runbook target of "under 5 minutes from
          # decision to rollback complete".
          #
          # The alarms are overridden, always (#148): the release being rolled
          # back is usually what holds the deployment group's 5xx alarm in
          # ALARM, and CodeDeploy stops every deployment to the group while one
          # is -- this one included. The override lasts for this deployment
          # only; the group's alarms are unchanged and watch the next deploy.
          # It needs codedeploy:UpdateDeploymentGroup on the workflow role
          # (docs/deployment/iam-permissions.md).
          #
          # The value is JSON with an explicit `alarms` list (#777). The
          # shorthand `enabled=false` was measured, with aws-cli 2.28.24
          # --debug, to send {"enabled": false} with no `alarms` key, and
          # CodeDeploy refused that on staging with InvalidAlarmConfigException
          # ("Alarm list cannot be null"). This JSON sends all three keys.
          # Whether CodeDeploy accepts the empty list with enabled false is
          # first shown by the next staging rollback rehearsal.
          DEPLOYMENT_ID="$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APPLICATION" \
            --deployment-group-name "$CODEDEPLOY_DEPLOYMENT_GROUP" \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce \
            --description "rollback: $REASON" \
            --override-alarm-configuration '{"enabled":false,"ignorePollAlarmFailure":false,"alarms":[]}' \
            --revision "$(jq -cn --arg c "$APPSPEC" '{revisionType:"AppSpecContent",appSpecContent:{content:$c}}')" \
            --query deploymentId --output text)"
          echo "deployment-id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "CodeDeploy deployment: $DEPLOYMENT_ID"

      # The deployment group sets `deployment_approval_wait_time=Duration.
      # minutes(30)`: "If the ContinueDeployment API is not called within the
      # wait time period, CodeDeploy will stop the deployment." The group also
      # sets `auto_rollback(stopped_deployment=True)`, so a stopped deployment
      # reverts -- to the revision being rolled back from. So this job approves
      # the shift itself, as soon as the deployment is Ready.
      #
      # `aws deploy wait deployment-successful` is not used: it cannot approve,
      # so it could only ever time out here.
      - name: Shift traffic and wait for it to land
        if: steps.stop.outputs.already_serving != 'true'
        env:
          DEPLOYMENT_ID: ${{ steps.codedeploy.outputs.deployment-id }}
          TARGET_ARN: ${{ steps.target.outputs.arn }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + ROLLBACK_TIMEOUT_SECONDS ))
          continued=0
          seen_ready=0

          # A read that fails -- a ThrottlingException, say -- is "could not
          # read": the value stays UNREAD, which is no status and no revision,
          # so it can never approve, fail or finish anything, and the next
          # poll reads again (#215). Before, a plain assignment under set -e
          # ended the rollback with a bare exit 254 mid-incident. After
          # READ_FAILURE_LIMIT polls in a row with a failed read (about a
          # minute) the step stops waiting and says so. The same rule as
          # scripts/ecs_rolling_rollout.sh's READ_FAILS.
          UNREAD="(could not be read)"
          READ_FAILURE_LIMIT=6
          read_failures=0
          last_error=""
          aws_errors="$(mktemp)"
          trap 'rm -f "$aws_errors"' EXIT
          # Free text from AWS (an AccessDenied names the role's ARN) loses
          # every run of twelve digits before it is printed: the log is public.
          scrub() {
            sed -E 's/(^|[^0-9A-Za-z])[0-9]{12}([^0-9A-Za-z]|$)/\1<account>\2/g'
          }
          # aws_read VAR <aws arguments>: sets VAR only when the call succeeds.
          aws_read() {
            local out
            if out="$(aws "${@:2}" 2>"$aws_errors")"; then
              printf -v "$1" '%s' "$out"
            else
              read_failed=1
              last_error="$(<"$aws_errors")"
              last_error="${last_error//$'\n'/ }"
              last_error="${last_error:0:200}"
              last_error="$(scrub <<<"$last_error")"
              echo "could not read from AWS (${last_error:-no error text}); reading again on the next poll"
            fi
          }

          while :; do
            read_failed=0
            status="$UNREAD"
            serving="$UNREAD"
            aws_read status deploy get-deployment --deployment-id "$DEPLOYMENT_ID" \
              --query deploymentInfo.status --output text

            case "$status" in
              Ready)
                seen_ready=1
                if [ "$continued" -eq 0 ]; then
                  echo "deployment is Ready -- approving the traffic shift"
                  if aws deploy continue-deployment --deployment-id "$DEPLOYMENT_ID" \
                       --deployment-wait-type READY_WAIT; then
                    continued=1
                  else
                    # Someone may have approved it between the read above and
                    # this call (an operator in the console). Read it again:
                    # still Ready means this run could not approve it, which
                    # is a failure; anything else is decided below.
                    status="$UNREAD"
                    aws_read status deploy get-deployment --deployment-id "$DEPLOYMENT_ID" \
                      --query deploymentInfo.status --output text
                    case "$status" in
                      Ready)
                        echo "::error::this run could not approve rollback deployment $DEPLOYMENT_ID (the error is above), and it is still waiting for approval"
                        exit 1
                        ;;
                      "$UNREAD") echo "continue-deployment failed, and $DEPLOYMENT_ID's status could not be read again: the next poll decides" ;;
                      *) echo "continue-deployment failed, and $DEPLOYMENT_ID has since left Ready ($status): it was approved, or ended, outside this run" ;;
                    esac
                  fi
                fi
                ;;
              Failed|Stopped)
                code="$(aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" \
                          --query 'deploymentInfo.errorInformation.code' --output text)" || code=""
                if [ "$code" = ALARM_ACTIVE ]; then
                  # This run overrides the group's alarms, so an alarm should
                  # not be able to stop it (#148 M5c). Say so, not "is Stopped".
                  echo "::error title=Rollback stopped by an alarm::rollback deployment $DEPLOYMENT_ID is $status for an alarm (ALARM_ACTIVE), although this run created it with the group's alarms overridden. What is serving now: python3 scripts/api_serving.py ${ECS_CLUSTER} ${ECS_BACKEND_SERVICE} ${TARGET_ARN##*/} (exit 0 = the target). docs/deployment/rollback-runbook.md#an-alarm-rolled-the-api-back"
                else
                  echo "::error::rollback deployment $DEPLOYMENT_ID is $status"
                fi
                { aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" \
                    --query 'deploymentInfo.{status:status,error:errorInformation}' --output json \
                    || echo "(its error information could not be read)"; } | scrub
                exit 1
                ;;
            esac

            # Success is "the target is serving", not "CodeDeploy says
            # Succeeded". After the shift the group waits an hour before
            # terminating the blue task set, and an operator in an incident
            # needs to know traffic has moved, not that CodeDeploy has finished
            # tidying up.
            #
            # But only once this run's OWN deployment has been approved
            # (#148). The target can be PRIMARY before that: the stop step's
            # auto-rollback of an in-flight deployment puts back the revision
            # it replaced, which is usually the target. Counting that as done
            # reported success on the first poll and left this run's
            # deployment waiting, unapproved, for 30 minutes, holding the
            # group, until CodeDeploy stopped it.
            #
            # Approved is observed, not "sent by this run": the deployment was
            # seen Ready and has since left Ready for InProgress, Baking or
            # Succeeded, by this run's continue-deployment or anyone else's.
            # A deployment never seen Ready never counts (CodeDeploy stops an
            # unapproved one when its wait ends; it does not leave Ready
            # otherwise).
            approved=""
            if [ "$continued" -eq 1 ]; then
              approved="approved by this run"
            elif [ "$seen_ready" -eq 1 ]; then
              case "$status" in
                InProgress|Baking|Succeeded) approved="approved outside this run: seen Ready, now $status" ;;
              esac
            fi
            aws_read serving ecs describe-services \
              --cluster "$ECS_CLUSTER" --services "$ECS_BACKEND_SERVICE" \
              --query "services[0].taskSets[?status=='PRIMARY'].taskDefinition" \
              --output text
            if [ -n "$approved" ] && [ "$serving" = "$TARGET_ARN" ]; then
              echo "traffic is on ${TARGET_ARN##*/} (deployment $DEPLOYMENT_ID $status, $approved)"
              break
            fi

            if [ "$read_failed" -eq 0 ]; then
              read_failures=0
            else
              read_failures=$(( read_failures + 1 ))
              if [ "$read_failures" -ge "$READ_FAILURE_LIMIT" ]; then
                if [ -n "$approved" ]; then
                  shift_state="The traffic shift was ${approved}."
                else
                  shift_state="This run had not seen the traffic shift approved; CodeDeploy stops an unapproved deployment when its 30-minute approval wait ends."
                fi
                echo "::error title=Rollback could not read AWS::${read_failures} polls in a row could not read rollback deployment ${DEPLOYMENT_ID} or what the API is serving, so this run stopped waiting. It did not stop the deployment and cannot tell whether traffic moved to ${TARGET_ARN##*/}. ${shift_state} The last AWS error: ${last_error:-no error text}. Check it by hand: aws deploy get-deployment --deployment-id ${DEPLOYMENT_ID}"
                exit 1
              fi
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              if [ -z "$approved" ] && [ "$serving" = "$TARGET_ARN" ]; then
                # The target serves, but not through this run's deployment:
                # say exactly that, not "did not put it in service".
                seen=no
                [ "$seen_ready" -eq 1 ] && seen=yes
                echo "::error::${TARGET_ARN##*/} is the PRIMARY task set, but this run never saw its own rollback deployment $DEPLOYMENT_ID approved within ${ROLLBACK_TIMEOUT_SECONDS}s (status $status; seen Ready by this run: $seen), so it does not count this as a rollback it did. If someone approved it before this run saw it Ready, check it with: aws deploy get-deployment --deployment-id $DEPLOYMENT_ID"
              else
                echo "::error::rollback deployment $DEPLOYMENT_ID did not put ${TARGET_ARN##*/} in service within ${ROLLBACK_TIMEOUT_SECONDS}s (status $status, serving ${serving##*/}, ${approved:-not approved})"
              fi
              exit 1
            fi
            sleep 10
          done

      - name: Verify what is serving traffic
        id: api-verify
        env:
          TARGET_ARN: ${{ steps.target.outputs.arn }}
        run: |
          set -euo pipefail
          # One call, both answers. The PRIMARY task set, not
          # services[0].taskDefinition: on a CODE_DEPLOY service that field is
          # "specified when the service is created with CreateService and can
          # be modified with UpdateService", and UpdateService is the call ECS
          # refuses here -- so it still names the revision CloudFormation
          # created and never moves.
          read -r SERVING RUNNING DESIRED <<<"$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_BACKEND_SERVICE" \
            --query "services[0].[taskSets[?status=='PRIMARY'].taskDefinition | [0], runningCount, desiredCount]" \
            --output text)"
          echo "serving: ${SERVING##*/}  ($RUNNING/$DESIRED tasks running)"

          if [ "$SERVING" != "$TARGET_ARN" ]; then
            echo "::error::expected ${TARGET_ARN##*/} to be serving, got ${SERVING##*/}"
            exit 1
          fi
          # A rollback that lands the right revision with one of three tasks
          # healthy is not a finished rollback, and was previously reported as
          # a clean success because this count was printed and never compared.
          if [ "$RUNNING" != "$DESIRED" ]; then
            echo "::error::$RUNNING of $DESIRED tasks are running on ${TARGET_ARN##*/}"
            exit 1
          fi

      # The dashboard, after the API is back and verified: the API rollback is
      # never delayed by the dashboard's rolling deployment, and CodeDeploy's
      # path above is unchanged. The rollout refuses, without update-service,
      # if the dashboard's PRIMARY is no longer what the check above recorded
      # (another Deploy, Rollback or cdk deploy since). When the target is
      # already PRIMARY there is nothing to roll: --no-update only confirms it.
      - name: Roll the dashboard back
        id: dashboard-rollback
        if: inputs.dashboard_task_definition_arn != ''
        env:
          DASHBOARD_TARGET_ARN: ${{ steps.dashboard-target.outputs.arn }}
          DASHBOARD_EXPECT: ${{ steps.dashboard-target.outputs.expect }}
          TARGET_ARN: ${{ steps.target.outputs.arn }}
          DEPLOYMENT_ID: ${{ steps.codedeploy.outputs.deployment-id }}
        run: |
          set -euo pipefail
          mode=()
          if [ "$DASHBOARD_EXPECT" = "$DASHBOARD_TARGET_ARN" ]; then
            mode=(--no-update)
            echo "the dashboard is already on ${DASHBOARD_TARGET_ARN##*/}: confirming it, not redeploying it"
          fi
          if bash scripts/ecs_rolling_rollout.sh ${mode[@]+"${mode[@]}"} \
               --expect-primary "$DASHBOARD_EXPECT" \
               --interval "$DASHBOARD_ROLLOUT_POLL_SECONDS" \
               --deadline "$DASHBOARD_ROLLOUT_DEADLINE_SECONDS" \
               "$ECS_CLUSTER" "$ECS_DASHBOARD_SERVICE" "$DASHBOARD_TARGET_ARN" >dashboard-rollback.txt; then
            cat dashboard-rollback.txt
            if [ "${#mode[@]}" -gt 0 ]; then
              echo "result=already serving ${DASHBOARD_TARGET_ARN##*/}; nothing changed" >> "$GITHUB_OUTPUT"
            else
              echo "result=rolled back to ${DASHBOARD_TARGET_ARN##*/}" >> "$GITHUB_OUTPUT"
            fi
          else
            code=$?
            cat dashboard-rollback.txt
            # Every failure here comes after the API was rolled back and
            # verified (this step's `if:` keeps the default success() gate), so
            # each one names that state and the one safe way out of it.
            if now="$(python3 scripts/dashboard_revision.py serving --cluster "$ECS_CLUSTER" --service "$ECS_DASHBOARD_SERVICE")"; then
              now="${now%%$'\n'*}"
            else
              now="(this run could not read what the dashboard is serving)"
            fi
            if [ -n "$DEPLOYMENT_ID" ]; then
              state="The API is on ${TARGET_ARN##*/} (CodeDeploy deployment ${DEPLOYMENT_ID}; any deployment in flight was stopped with auto-rollback first). The dashboard was not rolled back with it: ${now}. This is the newer-dashboard, older-API state until the dashboard is put back."
              way_out="To put the dashboard back, use docs/deployment/rollback-runbook.md Method 2, the dashboard block. Do not dispatch Rollback again while CodeDeploy deployment ${DEPLOYMENT_ID} is active: its stop step would stop that deployment with auto-rollback and put the API back on the release you rolled back from."
            else
              # The API was already on the target (#148): no deployment.
              state="The API is on ${TARGET_ARN##*/}; it already was, so this run created no CodeDeploy deployment and stopped nothing. The dashboard was not rolled back: ${now}."
              way_out="To put the dashboard back, use docs/deployment/rollback-runbook.md Method 2, the dashboard block."
            fi
            if grep -q 'which this run read earlier' dashboard-rollback.txt; then
              echo "::error title=Dashboard not rolled back::The dashboard changed after this run validated it (it is no longer ${DASHBOARD_EXPECT##*/}), so it was not touched. ${state} ${way_out}"
              echo "result=not changed: it changed after this run validated it" >> "$GITHUB_OUTPUT"
            elif grep -q 'rolled back by ECS' dashboard-rollback.txt; then
              echo "::error title=Dashboard rollback did not take::ECS's circuit breaker rejected ${DASHBOARD_TARGET_ARN##*/} and put ${DASHBOARD_EXPECT##*/} back. ${state} ${way_out}"
              echo "result=rejected by ECS's circuit breaker; serving ${DASHBOARD_EXPECT##*/}" >> "$GITHUB_OUTPUT"
            elif grep -q 'did not finish' dashboard-rollback.txt; then
              echo "::error title=Dashboard rollback did not finish::ECS is still rolling ${DASHBOARD_TARGET_ARN##*/} out; this run stopped waiting and did not stop it. ${state} ${way_out}"
              echo "result=did not finish in ${DASHBOARD_ROLLOUT_DEADLINE_SECONDS}s" >> "$GITHUB_OUTPUT"
            else
              echo "::error title=Dashboard not rolled back::The dashboard rollout failed (exit $code; the error above says why). ${state} ${way_out}"
              echo "result=failed (exit $code; the step's error says why)" >> "$GITHUB_OUTPUT"
            fi
            exit "$code"
          fi

      # The API half's refusal when the API was already on the target (#148
      # PE condition 2): the run fails, so nobody reads it as a rollback. It
      # comes after the dashboard's step so that the dashboard half, if one
      # was asked for, has run, and it says what that half did.
      - name: Refuse a rollback to the revision already serving
        if: ${{ !cancelled() && steps.stop.outputs.already_serving == 'true' }}
        env:
          TARGET_ARN: ${{ steps.target.outputs.arn }}
          DASHBOARD_INPUT: ${{ inputs.dashboard_task_definition_arn }}
          DASHBOARD_RESULT: ${{ steps.dashboard-rollback.outputs.result }}
          DASHBOARD_OUTCOME: ${{ steps.dashboard-rollback.outcome }}
        run: |
          set -euo pipefail
          if [ -z "$DASHBOARD_INPUT" ]; then
            dash="The dashboard was left as it is. For the dashboard alone: docs/deployment/rollback-runbook.md Method 2."
          elif [ "$DASHBOARD_OUTCOME" = success ]; then
            dash="The dashboard half ran as asked: dashboard ${DASHBOARD_RESULT}."
          elif [ "$DASHBOARD_OUTCOME" = failure ]; then
            dash="The dashboard half ran as asked and did not succeed: ${DASHBOARD_RESULT:-no result}. Its step says why; for the dashboard alone: docs/deployment/rollback-runbook.md Method 2."
          else
            # Skipped: a step before it failed (the API verify step, say).
            dash="The dashboard half did not run: an earlier step failed; see above. The dashboard was not changed; for the dashboard alone: docs/deployment/rollback-runbook.md Method 2."
          fi
          echo "::error title=Nothing to roll back::The API is already on ${TARGET_ARN##*/}, and no deployment was in flight, so there is nothing to roll back: this run created no CodeDeploy deployment and stopped nothing. ${dash}"
          exit 1

      # The outcome is keyed on the API's verify step and the dashboard's
      # step, never on job.status alone: when the API was rolled back and only
      # the dashboard failed, "NOT rolled back" would send the operator to
      # start a second Rollback, whose stop step reverts the first one. When
      # the verify step did not succeed, the API's clause comes from a
      # read-only read of what is serving at the end of the run (#755).
      - name: Run summary
        id: summary
        if: always()
        env:
          TARGET_ARN: ${{ steps.target.outputs.arn }}
          DEPLOYMENT_ID: ${{ steps.codedeploy.outputs.deployment-id }}
          DASHBOARD_INPUT: ${{ inputs.dashboard_task_definition_arn }}
          DASHBOARD_TARGET_ARN: ${{ steps.dashboard-target.outputs.arn }}
          DASHBOARD_SERVING_ARN: ${{ steps.dashboard-target.outputs.serving_arn }}
          DASHBOARD_SERVING_IMAGE: ${{ steps.dashboard-target.outputs.serving_image }}
          DASHBOARD_RESULT: ${{ steps.dashboard-rollback.outputs.result }}
          DASHBOARD_OUTCOME: ${{ steps.dashboard-rollback.outcome }}
          API_VERIFY: ${{ steps.api-verify.outcome }}
          ALREADY_SERVING: ${{ steps.stop.outputs.already_serving }}
          REFUSED: ${{ steps.stop.outputs.refused }}
          REFUSED_ID: ${{ steps.stop.outputs.refused_id }}
          REFUSED_PRIMARY: ${{ steps.stop.outputs.primary }}
          JOB_STATUS: ${{ job.status }}
          ACCOUNT_CHECK: ${{ steps.account.outcome }}
        run: |
          # No account ID, no registry host, no full ARN: the summary is public.
          case "$ACCOUNT_CHECK" in
            success) account_cell="matches the environment's AWS_ACCOUNT_ID secret" ;;
            failure) account_cell="does NOT match the environment's AWS_ACCOUNT_ID secret" ;;
            *) account_cell="not checked" ;;
          esac
          target_cell="${TARGET_ARN##*/}"
          dashboard_target="${DASHBOARD_TARGET_ARN##*/}"
          dashboard_serving_image="${DASHBOARD_SERVING_IMAGE#*/}"
          target="${TARGET_ARN##*/}"
          target="${target:-the target (not resolved)}"
          # The dashboard's half was given but never ran: read what it is
          # serving now (read-only), so the stuck state is on the page.
          not_reached=""
          if [ -n "$DASHBOARD_INPUT" ] && [ "$DASHBOARD_OUTCOME" != success ] && [ "$DASHBOARD_OUTCOME" != failure ]; then
            if now="$(python3 scripts/dashboard_revision.py serving --cluster "$ECS_CLUSTER" --service "$ECS_DASHBOARD_SERVICE")"; then
              not_reached="${now%%$'\n'*}"
            else
              not_reached="this run could not read what it is serving"
            fi
          fi
          # The run did not finish its own steps, but something it did may
          # still have put the API back: stopping the bad deployment with
          # auto-rollback does that before CodeDeploy is asked for anything
          # (#755, run 37080696791). So the headline says what is serving at
          # the end of the run, read with the same predicate the stop step
          # uses (read-only), rather than which step passed. Not for a refused
          # or already-serving run (their verdict is decided), and not without
          # a resolved target (nothing to compare against).
          #
          # SUMMARY_SERVING_POLLS reads, SUMMARY_SERVING_POLL_SECONDS apart,
          # stopping at the first 0 and deciding on the last answer: a revert
          # reroute may still be moving when this step starts. The default of
          # 12 reads 5 s apart is a guess, until the deployment history after
          # d-F32H2PR9L says how long a revert takes. No read starts after
          # SUMMARY_SERVING_DEADLINE_SECONDS (90), so the worst case is 90 s
          # plus one read of four describe calls, inside timeout-minutes: 90.
          serving_rc=""
          serving_said=""
          if [ "$API_VERIFY" != success ] && [ -n "$TARGET_ARN" ] && [ -z "$REFUSED" ] && [ "$ALREADY_SERVING" != true ]; then
            polls="${SUMMARY_SERVING_POLLS:-12}"
            poll_seconds="${SUMMARY_SERVING_POLL_SECONDS:-5}"
            deadline=$(( SECONDS + ${SUMMARY_SERVING_DEADLINE_SECONDS:-90} ))
            n=0
            while :; do
              n=$(( n + 1 ))
              rc=0
              said="$(python3 scripts/api_serving.py "$ECS_CLUSTER" "$ECS_BACKEND_SERVICE" "$TARGET_ARN" 2>&1)" || rc=$?
              # Its own sentence, one line, bounded, and with any run of
              # twelve digits gone: it goes into a public summary and Slack.
              # On 0 that is the first line ("serving: ..."); otherwise the
              # last ("NOT YET: ...", "UNKNOWN: ...", "WRONG: ...").
              said="${said%$'\n'}"
              if [ "$rc" = 0 ]; then
                said="${said%%$'\n'*}"
              else
                said="${said##*$'\n'}"
              fi
              said="${said:0:300}"
              said="$(sed -E 's/(^|[^0-9A-Za-z])[0-9]{12}([^0-9A-Za-z]|$)/\1<account>\2/g' <<<"$said")"
              serving_rc="$rc"
              serving_said="$said"
              echo "what the API is serving, read ${n} of ${polls}: exit ${rc}: ${said}"
              if [ "$rc" = 0 ] || [ "$n" -ge "$polls" ] || [ "$SECONDS" -ge "$deadline" ]; then
                break
              fi
              sleep "$poll_seconds"
            done
          fi
          if [ "$REFUSED" = codeDeployRollback ]; then
            # Nothing was stopped or rolled (#148 W9).
            api="API NOT rolled back: CodeDeploy's own rollback ${REFUSED_ID} is still active, so this run stopped nothing (the API is on ${REFUSED_PRIMARY:-a revision this run could not read})"
            if [ -z "$DASHBOARD_INPUT" ]; then
              dash="dashboard left as it is"
            else
              dash="dashboard NOT rolled back (not reached)"
            fi
          elif [ "$REFUSED" = unreadable ]; then
            api="API NOT rolled back: the creator of in-flight deployment ${REFUSED_ID} could not be read, so this run stopped nothing"
            if [ -z "$DASHBOARD_INPUT" ]; then
              dash="dashboard left as it is"
            else
              dash="dashboard NOT rolled back (not reached)"
            fi
          elif [ "$ALREADY_SERVING" = true ]; then
            # Refused (#148 PE condition 2): not a rollback, whatever the
            # dashboard half did.
            api="API NOT rolled back: it was already on ${target}, so there was nothing to roll back and no deployment was created"
            if [ -z "$DASHBOARD_INPUT" ]; then
              dash="dashboard left as it is"
            elif [ "$DASHBOARD_OUTCOME" = success ]; then
              dash="dashboard ${DASHBOARD_RESULT}"
            else
              dash="dashboard NOT rolled back (${DASHBOARD_RESULT:-not reached})"
            fi
          elif [ "$API_VERIFY" = success ]; then
            api="API rolled back to ${target}"
            if [ -z "$DASHBOARD_INPUT" ]; then
              dash="dashboard left as it is"
            elif [ "$DASHBOARD_OUTCOME" = success ]; then
              dash="dashboard ${DASHBOARD_RESULT}"
            else
              dash="dashboard NOT rolled back (${DASHBOARD_RESULT:-not reached})"
            fi
          elif [ "$serving_rc" = 0 ]; then
            # What is serving, not which step passed (#755). The run still
            # fails: its own steps did not finish.
            api="API is serving ${target}, read at the end of the run, but this run did not finish its own steps (its verify step: ${API_VERIFY:-not reached})"
            if [ -z "$DASHBOARD_INPUT" ]; then
              dash="dashboard left as it is"
            else
              dash="dashboard NOT rolled back (not reached), so the API and dashboard are on different releases: put the dashboard back with docs/deployment/rollback-runbook.md Method 2, the dashboard block"
            fi
          elif [ -n "$serving_rc" ]; then
            # Not confirmed is not "not rolled back": exit 1 is also a split
            # listener mid-reroute, and 2 is a read that failed.
            api="API not confirmed on ${target} at the end of the run (scripts/api_serving.py exit ${serving_rc}: ${serving_said:-no output}); this run did not finish its own steps (its verify step: ${API_VERIFY:-not reached})"
            if [ -z "$DASHBOARD_INPUT" ]; then
              dash="dashboard left as it is"
            else
              dash="dashboard NOT rolled back (not reached)"
            fi
          else
            # No target resolved, so nothing to read against.
            api="API NOT rolled back (its verify step: ${API_VERIFY:-not reached})"
            if [ -z "$DASHBOARD_INPUT" ]; then
              dash="dashboard left as it is"
            else
              dash="dashboard NOT rolled back (not reached)"
            fi
          fi
          headline="${TARGET_ENV}: ${api}; ${dash}"
          echo "slack=${headline}" >> "$GITHUB_OUTPUT"
          {
            echo "## Rollback of ${headline}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`${TARGET_ENV}\` |"
            echo "| Account / region | ${account_cell} / \`${AWS_REGION}\` |"
            echo "| Target revision | \`${target_cell:-not resolved}\` |"
            echo "| CodeDeploy deployment | \`${DEPLOYMENT_ID:-not created}\` |"
            if [ -n "$DASHBOARD_INPUT" ]; then
              echo "| Dashboard target | \`${dashboard_target:-not resolved}\` |"
              echo "| Dashboard result | ${DASHBOARD_RESULT:-not reached} |"
            fi
            if [ -n "$serving_rc" ]; then
              echo "| API at the end of the run | ${serving_said:-no output} (scripts/api_serving.py exit ${serving_rc}) |"
            fi
            echo ""
            if [ -z "$DASHBOARD_INPUT" ]; then
              # An API-only rollback leaves the dashboard as it was: say what
              # that is, so a new dashboard on an old API is visible.
              if [ -n "$DASHBOARD_SERVING_ARN" ]; then
                echo "Dashboard not rolled back: it is serving ${DASHBOARD_SERVING_ARN##*/} (${dashboard_serving_image})."
              else
                echo "Dashboard not rolled back, and this run could not read what it is serving."
              fi
            elif [ -n "$not_reached" ] && [ -n "$REFUSED" ]; then
              echo "Dashboard not rolled back (the API half refused, and nothing was stopped): ${not_reached}. To put the dashboard back alone, use docs/deployment/rollback-runbook.md Method 2, the dashboard block."
            elif [ -n "$not_reached" ] && [ "$serving_rc" = 0 ]; then
              echo "Dashboard not rolled back (the API half did not finish): ${not_reached}. The API is on ${target}, so the API and dashboard are on different releases, the newer-dashboard, older-API state: put the dashboard back with docs/deployment/rollback-runbook.md Method 2, the dashboard block."
            elif [ -n "$not_reached" ]; then
              echo "Dashboard not rolled back (the API half failed): ${not_reached}. If the stop step already reverted the API, this is the newer-dashboard, older-API state: put the dashboard back with docs/deployment/rollback-runbook.md Method 2, the dashboard block."
            fi
            if [ -n "$serving_rc" ] && [ -n "$DEPLOYMENT_ID" ]; then
              echo ""
              echo "Do not dispatch Rollback again while CodeDeploy deployment ${DEPLOYMENT_ID} is active: its stop step would stop that deployment with auto-rollback, which reverts whatever it has shifted. Check it first: aws deploy get-deployment --deployment-id ${DEPLOYMENT_ID} --query deploymentInfo.status"
            fi
            echo ""
            echo "Job status: ${JOB_STATUS}."
            if [ "$API_VERIFY" = success ] && [ "$ALREADY_SERVING" != true ] && [ -z "$REFUSED" ]; then
              # The API tasks do not migrate on start (#298): the rolled-back
              # release starts against the schema the newer one migrated.
              echo "The database was not rolled back: a migration the newer release applied is still applied, and ${target} runs against that schema as it is. That works only if every migration since ${target}'s release is backward-compatible, and a new task of ${target} starts against it only if the revision sets RUN_MIGRATIONS=false: docs/deployment/rollback-runbook.md#the-rolled-back-api-runs-against-the-current-schema. For a migration that is not backward-compatible: docs/deployment/rollback-runbook.md, Database Rollback Procedure."
            else
              echo "A migration the bad release applied is still applied: docs/deployment/rollback-runbook.md, Database Rollback Procedure."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # `if: always()`. Without it every failure path above left #deployments
      # holding the "ROLLBACK initiated" message and nothing after it, so
      # responders reading Slack believed a rollback was in flight while the
      # job had been dead for minutes.
      - name: Notify rollback result
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: '#deployments'
          slack-message: |
            *Rollback of ${{ steps.summary.outputs.slack || format('{0}: outcome unknown ({1}); see the run', inputs.environment, job.status) }}*
            Task definition: `${{ steps.shown.outputs.target || 'not read' }}`
            Triggered by: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true
