# The documentation's shell examples (scripts/doc_examples.py).
#
# `examples` runs every enrolled page's examples, as written, against a stack of
# the page's own (scripts/doc_examples.py --run), in shards: `plan` asks the
# runner for them (--plan: by image profile, at most PAGES_PER_SHARD pages each)
# and `summary` fails unless every page ran exactly once and every block ran
# (--summarise). On a pull request the images are pre-built from the GHA cache
# first, by bake reading docker-compose.yml itself, so the documented
# `docker compose up -d --wait` starts them without rebuilding; on main, the
# nightly and a dispatch, compose builds from nothing, which is the path a
# reader takes.
#
# `render` checks the contract on every enrolled page -- every shell fence
# tagged in the form the site renders as code, nothing a reader cannot paste,
# exact counts -- then builds the site with the site's own toolchain and checks
# each enrolled page rendered its fences as code. It also runs the documentation
# regression tests, because the PR QA Gate skips unit tests on a pull request
# that changes only docs/, which is exactly the pull request that breaks a page.
#
# Not a required check (documentation merges without a CI gate; founder,
# 2026-09-24). A red run on main, the nightly or a dispatch files an issue.
name: Doc Examples

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'  # 02:30 UTC, after nightly-qa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-examples-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    name: Doc Examples (render)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # The regression tests import the API's schemas; the site toolchain comes
      # from the one script docs.yml also runs.
      - name: Install
        run: |
          pip install -r backend/requirements.txt
          bash scripts/docs_toolchain.sh

      - name: Contract (tags, contents, counts)
        run: python scripts/doc_examples.py --check

      - name: Documentation regression tests
        env:
          APP_ENV: test
          TESTING: 'true'
        run: python -m pytest backend/tests/unit/docs/ backend/tests/unit/scripts/test_doc_examples.py -p no:cov -q

      # Rendered even when an earlier step failed: a tag that breaks the page is
      # reported by both checks, and the render check is the one that sees the
      # built HTML.
      - name: Build the site
        if: ${{ !cancelled() }}
        run: mkdocs build

      - name: Rendered as code
        if: ${{ !cancelled() }}
        run: python scripts/doc_examples.py --render site

  # The shards: which pages run where is the runner's decision (--plan), from
  # the enrolment, so a content batch never edits this file to add a page.
  plan:
    name: Doc Examples (plan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Plan the shards
        id: plan
        run: |
          set -euo pipefail
          matrix=$(python scripts/doc_examples.py --plan)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  examples:
    name: Doc Examples (run ${{ matrix.profile }} ${{ matrix.shard }}/${{ matrix.of }})
    needs: plan
    runs-on: ubuntu-latest
    # A shard holds at most PAGES_PER_SHARD pages (scripts/doc_examples.py),
    # measured at 60-73 s each, so its run step stays near 8 minutes. The runner
    # stops itself before this timeout, at the deadline the first step exports,
    # so a hang is named rather than killed.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 20 }}
    strategy:
      # One red shard must not cancel the others: the summary would then report
      # their pages as missing and bury the real failure.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # First, so the runner's deadline counts from (within seconds of) the
      # moment timeout-minutes starts counting.
      - name: Record the job start
        run: echo "DOCEX_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Tool versions
        run: |
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          bash --version | head -1
          jq --version

      - name: Set up Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v4

      # The build definitions come from docker-compose.yml itself (no second
      # copy); `source: .` builds the checkout, not the Git context. The
      # profile picks the API's build target and the dashboard's build argument
      # exactly as `docker compose` does.
      - name: Pre-build the images compose would build (core)
        if: github.event_name == 'pull_request' && matrix.profile == 'core'
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          targets: api,frontend
          load: true
          set: |
            api.cache-from=type=gha,scope=docex-api
            frontend.cache-from=type=gha,scope=docex-web

      # The full API reads `api-full`, which security-scan already writes on
      # main from the same Dockerfile and target, then `docex-api` for the
      # layers the profiles share. The full dashboard's scope, `docex-web-full`,
      # has no other writer; cache-warm below fills it.
      - name: Pre-build the images compose would build (full)
        if: github.event_name == 'pull_request' && matrix.profile == 'full'
        uses: docker/bake-action@v7
        env:
          EXPERIMENTLY_PROFILE: full
        with:
          source: .
          files: docker-compose.yml
          targets: api,frontend
          load: true
          set: |
            api.cache-from=type=gha,scope=api-full
            api.cache-from=type=gha,scope=docex-api
            frontend.cache-from=type=gha,scope=docex-web-full

      # PYTHONUNBUFFERED as well as the runner's own line buffering, so a job
      # killed mid-page still shows the page it was on. The timeout is the
      # job's timeout-minutes expression, character for character (a test holds
      # the two identical); the runner stops DEADLINE_MARGIN_SECONDS before it.
      - name: Run the documentation's examples
        env:
          PYTHONUNBUFFERED: '1'
          DOCEX_JOB_TIMEOUT_MINUTES: ${{ github.event_name == 'pull_request' && 15 || 20 }}
          SHARD: ${{ matrix.profile }}:${{ matrix.shard }}/${{ matrix.of }}
          REPORT: docex-report/${{ matrix.profile }}-${{ matrix.shard }}.json
        run: python scripts/doc_examples.py --run --shard "$SHARD" --report "$REPORT"

      # Even when the run failed or stopped at its deadline: the summary needs
      # every shard's report. `overwrite`, because artifacts are immutable and a
      # re-run of one shard uploads the same name again.
      - name: Keep the shard's report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: doc-examples-report-${{ matrix.profile }}-${{ matrix.shard }}
          path: docex-report/
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  # The only job that notices a shard that never ran, a page no shard ran, or a
  # block that stopped being reached: what must have run comes from the
  # enrolment, not from the matrix. `!cancelled()` rather than `always()`, so a
  # pull request run superseded by a newer push is not also reported red.
  summary:
    name: Doc Examples (summary)
    needs: [plan, examples]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # No report at all is the summary's to judge (it fails), so a download
      # that finds nothing must not end the job before it.
      - name: Collect the shard reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: doc-examples-report-*
          path: docex-reports
          merge-multiple: true

      - name: Every page ran once, and every block ran
        run: python scripts/doc_examples.py --summarise docex-reports

      # Advisory: check() holds only the shape of `bug #N: ...`, because it runs
      # where there is no network; whether the issue is still open is asked here.
      - name: The issues that bug skips name are open
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          numbers=$(python scripts/doc_examples.py --bug-issues)
          for number in $numbers; do
            state=$(gh issue view "$number" --repo "$REPO" --json state --jq .state 2>/dev/null || echo UNKNOWN)
            if [ "$state" = OPEN ]; then
              echo "bug #$number: open"
            else
              echo "::warning::a skip reason names bug #$number, which is $state; fix the page or the reason"
            fi
          done

  # GHA caches written from a pull request are visible to that pull request only;
  # only the default branch's are shared, so main fills the cache the pull
  # requests read. The full API's layers are `api-full`, which security-scan
  # already writes on main; only the full dashboard has no other writer.
  cache-warm:
    name: Doc Examples (cache)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          targets: api,frontend
          set: |
            api.cache-to=type=gha,scope=docex-api,mode=max
            frontend.cache-to=type=gha,scope=docex-web,mode=max
            *.output=type=cacheonly
      - uses: docker/bake-action@v7
        env:
          EXPERIMENTLY_PROFILE: full
        with:
          source: .
          files: docker-compose.yml
          targets: frontend
          set: |
            frontend.cache-to=type=gha,scope=docex-web-full,mode=max
            *.output=type=cacheonly

  failure-issue:
    name: File an issue on failure
    runs-on: ubuntu-latest
    # Not cache-warm: a cold cache is not a red documentation page. The
    # summary, because a shard that never ran is red only there.
    needs: [render, examples, summary]
    if: failure() && github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Documentation examples are red"
          BODY="Doc Examples failed on $(date -u '+%Y-%m-%d') (${GITHUB_EVENT_NAME}, commit ${GITHUB_SHA})."$'\n\n'"Run: ${RUN_URL}"

          # `|| true`: the label does not exist yet on the first red run.
          EXISTING=$(gh issue list --repo "$REPO" --state open --label doc-examples-failure \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh label create doc-examples-failure --repo "$REPO" --color B60205 \
              --description "Doc Examples failed" 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label doc-examples-failure --body "$BODY"
          fi
