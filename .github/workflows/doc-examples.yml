# The documentation's shell examples (scripts/doc_examples.py).
#
# `examples` runs every enrolled page's examples, as written, against a stack of
# the page's own (scripts/doc_examples.py --run). On a pull request the images are
# pre-built from the GHA cache first, by bake reading docker-compose.yml itself,
# so the documented `docker compose up -d --wait` starts them without rebuilding;
# on main, the nightly and a dispatch, compose builds from nothing, which is the
# path a reader takes.
#
# `render` checks the contract on every enrolled page -- every shell fence
# tagged in the form the site renders as code, nothing a reader cannot paste,
# exact counts -- then builds the site with the site's own toolchain and checks
# each enrolled page rendered its fences as code. It also runs the documentation
# regression tests, because the PR QA Gate skips unit tests on a pull request
# that changes only docs/, which is exactly the pull request that breaks a page.
#
# Not a required check (documentation merges without a CI gate; founder,
# 2026-09-24). A red run on main, the nightly or a dispatch files an issue.
name: Doc Examples

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'  # 02:30 UTC, after nightly-qa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-examples-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    name: Doc Examples (render)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # The regression tests import the API's schemas; the site toolchain comes
      # from the one script docs.yml also runs.
      - name: Install
        run: |
          pip install -r backend/requirements.txt
          bash scripts/docs_toolchain.sh

      - name: Contract (tags, contents, counts)
        run: python scripts/doc_examples.py --check

      - name: Documentation regression tests
        env:
          APP_ENV: test
          TESTING: 'true'
        run: python -m pytest backend/tests/unit/docs/ backend/tests/unit/scripts/test_doc_examples.py -p no:cov -q

      # Rendered even when an earlier step failed: a tag that breaks the page is
      # reported by both checks, and the render check is the one that sees the
      # built HTML.
      - name: Build the site
        if: ${{ !cancelled() }}
        run: mkdocs build

      - name: Rendered as code
        if: ${{ !cancelled() }}
        run: python scripts/doc_examples.py --render site

  examples:
    name: Doc Examples (run)
    runs-on: ubuntu-latest
    # Measured 2026-09-25: 4m10s with pre-built images (pull request), 3m21s
    # building from nothing (dispatch). Several times that, so a hang fails fast.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 20 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Tool versions
        run: |
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          bash --version | head -1
          jq --version

      - name: Set up Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v4

      # The build definitions come from docker-compose.yml itself (no second
      # copy); `source: .` builds the checkout, not the Git context.
      - name: Pre-build the images compose would build
        if: github.event_name == 'pull_request'
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          targets: api,frontend
          load: true
          set: |
            api.cache-from=type=gha,scope=docex-api
            frontend.cache-from=type=gha,scope=docex-web

      - name: Run the documentation's examples
        run: python scripts/doc_examples.py --run

  # GHA caches written from a pull request are visible to that pull request only;
  # only the default branch's are shared, so main fills the cache the pull
  # requests read.
  cache-warm:
    name: Doc Examples (cache)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          targets: api,frontend
          set: |
            api.cache-to=type=gha,scope=docex-api,mode=max
            frontend.cache-to=type=gha,scope=docex-web,mode=max
            *.output=type=cacheonly

  failure-issue:
    name: File an issue on failure
    runs-on: ubuntu-latest
    # Not cache-warm: a cold cache is not a red documentation page.
    needs: [render, examples]
    if: failure() && github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Documentation examples are red"
          BODY="Doc Examples failed on $(date -u '+%Y-%m-%d') (${GITHUB_EVENT_NAME}, commit ${GITHUB_SHA})."$'\n\n'"Run: ${RUN_URL}"

          # `|| true`: the label does not exist yet on the first red run.
          EXISTING=$(gh issue list --repo "$REPO" --state open --label doc-examples-failure \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh label create doc-examples-failure --repo "$REPO" --color B60205 \
              --description "Doc Examples failed" 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label doc-examples-failure --body "$BODY"
          fi
