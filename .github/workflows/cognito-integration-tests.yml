name: Cognito Integration Tests
on:
  # `branches: [main]` on the push trigger, or a push to a pull-request branch
  # fires this workflow twice on one commit -- once for `push`, once for
  # `pull_request` -- which is the duplication the concurrency group below
  # cannot dedupe, because the two events are deliberately in separate groups.
  push:
    branches: [main]
    paths:
      - 'backend/app/services/auth_service.py'
      - 'backend/app/api/v1/endpoints/auth.py'
      - 'backend/tests/integration/auth/**'
  pull_request:
    paths:
      - 'backend/app/**'
  workflow_dispatch:


# Supersede an in-flight run of the same pull request; a batch of Dependabot
# rebases with no group here turned into roughly 2000 jobs and exhausted the
# Actions spending limit.
#
# `github.ref` rather than `github.head_ref`: for a pull request `github.ref`
# is the unique `refs/pull/<n>/merge`, while `head_ref` is the bare branch
# name with no fork owner, so two contributors pushing a branch both named
# `patch-1` -- GitHub's default for a web-UI edit -- would cancel each other's
# required checks. `github.event_name` keeps the triggers in separate groups.
#
# Only pull requests are cancelled. A push to main runs to completion: cancel
# it and the commit that is actually on main carries a cancelled status, and a
# failure it introduced is attributed to whichever merge landed next.
concurrency:
  group: cognito-integration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cognito-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run Cognito integration tests
        env:
          APP_ENV: test
          TESTING: "true"
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_SECURITY_TOKEN: testing
          AWS_SESSION_TOKEN: testing
        run: |
          python -m pytest backend/tests/integration/auth/ -v \
            --tb=short \
            -m "not slow" \
            --junit-xml=test-results/cognito-integration.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cognito-test-results
          path: test-results/
