name: Advanced Toggle & Audit Tests
on:
  push:
    paths:
      - 'backend/app/services/audit_service.py'
      - 'backend/app/api/v1/endpoints/bulk_toggle.py'
      - 'backend/app/schemas/advanced_toggle.py'
  pull_request:
    paths: ['backend/app/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r backend/requirements.txt
      - name: Run tests
        env: {APP_ENV: test, TESTING: "true"}
        run: |
          python -m pytest \
            backend/tests/unit/services/test_audit_service_advanced.py \
            backend/tests/unit/api/test_bulk_toggle_endpoints.py \
            backend/tests/unit/schemas/test_advanced_toggle_schemas.py \
            -v --tb=short
