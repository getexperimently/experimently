name: Infrastructure Tests

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'modules/infrastructure/**'
      - '.github/workflows/infrastructure-tests.yml'
  # NO path filter on pull_request, deliberately. These tests now include a
  # real `cdk synth` for both profiles, and the defect that motivated it --
  # a stack dependency cycle that made `cdk synth` and `cdk deploy` impossible
  # for six months -- was introduced by a change under infrastructure/ but
  # could equally have come from modules/, a requirements bump, or a Python
  # version change. A path-filtered job also cannot be a required check: it
  # never reports on the pull requests it skips, so the branch protection
  # entry would sit pending for ever.
  #
  # The cost is ~2 minutes, nearly all of it `pip install`, against a gate
  # that would have caught a six-month outage of the entire deploy path.
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cdk-python-tests:
    name: CDK Stack Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js (required by the CDK jsii runtime)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # --import-mode=importlib keeps the local `infrastructure/constructs`
      # directory from shadowing the `constructs` package that aws-cdk-lib needs.
      - name: Run CDK stack tests
        run: |
          python -m pytest infrastructure/tests -v --tb=short \
            -o addopts="" --import-mode=importlib
