# THIRD_PARTY_LICENSES.md is the distribution's attribution record, and it had
# rotted through two dependency changes with nothing to notice (#170): the
# committed file still named `databricks-sql-connector 3.7.5` after the pin
# moved to 4.5.0, and still listed the 106-package remark/unified tree that
# P3.4 removed from the dashboard.
#
# It rotted because it could not be regenerated correctly anywhere a person
# was likely to try. Both resolvers read the machine rather than the lock
# files: `pip-licenses` reports the active virtualenv, and `license-checker`
# reads `node_modules`, which npm fills with the *current platform's* optional
# binaries -- so a laptop run records `@img/sharp-darwin-arm64` in the record
# for an amd64 Linux image. The generator now refuses outside a matching
# environment; this job is that environment.
#
# Deliberately NOT a required check: it is path-filtered, and a path-filtered
# job never reports on the pull requests it skips, so requiring it would block
# every unrelated PR.
name: Third-party licences

# Supersede an in-flight run of the same pull request. Keyed on `github.ref`
# (`refs/pull/<n>/merge` for a pull request) rather than `github.head_ref`, so
# two forks pushing a branch of the same name do not cancel each other.
concurrency:
  group: third-party-licences-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'backend/requirements/runtime.lock'
      - 'modules/requirements.lock'
      - '**/package.json'
      - '**/package-lock.json'
      - 'scripts/generate_third_party_licenses.py'
      - 'THIRD_PARTY_LICENSES.md'
      - '.github/workflows/third-party-licenses.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: THIRD_PARTY_LICENSES.md matches the dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The environment the generator requires, shared with
      # dependabot-licences.yml so there is one definition of it. It reads the
      # pip-licenses pin out of the Makefile rather than carrying a copy.
      - uses: ./.github/actions/licence-environment

      # `--out` alongside `--check`: main() writes the rendered document
      # before it compares, so the artifact costs nothing extra. Running the
      # generator a second time on failure meant six more npx resolutions and
      # another pip-licenses pass to obtain a document already in memory.
      - name: Check the committed file
        id: check
        run: |
          python scripts/generate_third_party_licenses.py \
            --check --out THIRD_PARTY_LICENSES.generated.md

      # On a failing check, hand back the document this environment produces,
      # so the fix is "download and commit" rather than "find a Linux box".
      - name: Upload the regenerated file
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: THIRD_PARTY_LICENSES
          path: THIRD_PARTY_LICENSES.generated.md
          if-no-files-found: error
