name: Scheduler Enhancement Tests (P3-B)

on:
  push:
    paths:
      - 'backend/app/schemas/scheduler.py'
      - 'backend/app/models/scheduler_run.py'
      - 'backend/app/services/notification_service.py'
      - 'backend/app/services/scheduler_health_service.py'
      - 'backend/app/core/scheduler_retry.py'
      - 'backend/app/api/v1/endpoints/scheduler_health.py'
      - 'backend/tests/unit/schemas/test_scheduler_schemas.py'
      - 'backend/tests/unit/services/test_notification_service.py'
      - 'backend/tests/unit/services/test_scheduler_health_service.py'
      - 'backend/tests/unit/core/test_scheduler_retry.py'
      - 'backend/tests/unit/api/test_scheduler_health_endpoints.py'
  pull_request:
    paths:
      - 'backend/app/**'
      - 'backend/tests/**'
  workflow_dispatch:

jobs:
  scheduler-tests:
    name: Run Scheduler Enhancement Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run schema tests
        env:
          APP_ENV: test
          TESTING: "true"
        run: |
          python -m pytest \
            backend/tests/unit/schemas/test_scheduler_schemas.py \
            -v --tb=short

      - name: Run notification service tests
        env:
          APP_ENV: test
          TESTING: "true"
        run: |
          python -m pytest \
            backend/tests/unit/services/test_notification_service.py \
            -v --tb=short

      - name: Run scheduler health service tests
        env:
          APP_ENV: test
          TESTING: "true"
        run: |
          python -m pytest \
            backend/tests/unit/services/test_scheduler_health_service.py \
            -v --tb=short

      - name: Run scheduler retry tests
        env:
          APP_ENV: test
          TESTING: "true"
        run: |
          python -m pytest \
            backend/tests/unit/core/test_scheduler_retry.py \
            -v --tb=short

      - name: Run endpoint tests
        env:
          APP_ENV: test
          TESTING: "true"
        run: |
          python -m pytest \
            backend/tests/unit/api/test_scheduler_health_endpoints.py \
            -v --tb=short

      - name: Run all P3-B tests together
        env:
          APP_ENV: test
          TESTING: "true"
        run: |
          python -m pytest \
            backend/tests/unit/schemas/test_scheduler_schemas.py \
            backend/tests/unit/services/test_notification_service.py \
            backend/tests/unit/services/test_scheduler_health_service.py \
            backend/tests/unit/core/test_scheduler_retry.py \
            backend/tests/unit/api/test_scheduler_health_endpoints.py \
            -v --tb=short
