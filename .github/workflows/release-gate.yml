name: Release Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-gate:
    name: Backend Gate (Unit + Smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start deterministic backend test dependencies
        run: docker compose -f docker-compose.test.yml up -d postgres-test redis-test

      - name: Run backend release checks
        env:
          EP_TEST_PROFILE: compose
        run: ./scripts/run-backend-tests.sh release

      - name: Stop test dependencies
        if: always()
        run: docker compose -f docker-compose.test.yml down --remove-orphans

  frontend-gate:
    name: Frontend Gate (Test + Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run tests
        run: cd frontend && npm test -- --passWithNoTests --watchAll=false

      - name: Build frontend
        run: cd frontend && npm run build

  security-gate:
    name: Security Gate (Bandit + Gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits via the API on pull_request
    # events; the default token has no pull-requests scope, so grant it.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit high severity checks
        run: bandit -r backend/app -ll

      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate-summary:
    name: Release Gate Summary
    runs-on: ubuntu-latest
    needs: [backend-gate, frontend-gate, security-gate]
    if: always()
    steps:
      - name: Fail if any gate failed
        run: |
          if [ "${{ needs.backend-gate.result }}" != "success" ] || \
             [ "${{ needs.frontend-gate.result }}" != "success" ] || \
             [ "${{ needs.security-gate.result }}" != "success" ]; then
            echo "::error::Release gate failed"
            exit 1
          fi
          echo "Release gate passed"
