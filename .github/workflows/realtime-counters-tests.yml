name: Real-time Counters Tests (P2-B)

on:
  push:
    paths:
      - 'backend/app/services/dynamodb_counter_service.py'
      - 'backend/app/schemas/realtime_counters.py'
      - 'backend/app/api/v1/endpoints/realtime_counters.py'
      - 'backend/lambda/event_processor/counter_integration.py'
      - 'infrastructure/cdk/stacks/dynamodb_counters_stack.py'
      - 'backend/tests/unit/schemas/test_realtime_counters_schemas.py'
      - 'backend/tests/unit/services/test_dynamodb_counter_service.py'
      - 'backend/tests/unit/api/test_realtime_counters_endpoints.py'
  pull_request:
    paths:
      - 'backend/app/**'
      - 'backend/lambda/event_processor/**'
  workflow_dispatch:

jobs:
  test:
    name: Run real-time counter unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run schema tests
        env:
          APP_ENV: test
          TESTING: "true"
        run: |
          python -m pytest \
            backend/tests/unit/schemas/test_realtime_counters_schemas.py \
            -v --tb=short

      - name: Run DynamoDB service tests
        env:
          APP_ENV: test
          TESTING: "true"
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: |
          python -m pytest \
            backend/tests/unit/services/test_dynamodb_counter_service.py \
            -v --tb=short

      - name: Run API endpoint tests
        env:
          APP_ENV: test
          TESTING: "true"
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: |
          python -m pytest \
            backend/tests/unit/api/test_realtime_counters_endpoints.py \
            -v --tb=short

      - name: Run all counter tests together
        env:
          APP_ENV: test
          TESTING: "true"
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: |
          python -m pytest \
            backend/tests/unit/schemas/test_realtime_counters_schemas.py \
            backend/tests/unit/services/test_dynamodb_counter_service.py \
            backend/tests/unit/api/test_realtime_counters_endpoints.py \
            -v --tb=short --junit-xml=test-results/realtime-counters.xml

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: realtime-counters-test-results
          path: test-results/
          retention-days: 7
