name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Weekly Monday 8am UTC

jobs:
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install bandit pip-audit

      # Both trees: the modules (SAML parsing, PHI encryption, the SQL-building
      # warehouse connectors, the inbound webhooks) moved to modules/backend/app
      # and `-r backend/app` no longer reaches them. modules/ is absent in a
      # core checkout, so it is passed only when it is there.
      - name: Run Bandit
        run: |
          targets=backend/app
          if [ -d modules/backend/app ]; then targets="$targets modules/backend/app"; fi
          echo "bandit -r $targets"
          # shellcheck disable=SC2086
          bandit -r $targets -f json -o bandit-report.json || true
          # shellcheck disable=SC2086
          bandit -r $targets -ll  # Only show medium+ severity, fail on high
        continue-on-error: false

      # Informational: lists every advisory for the pinned versions regardless
      # of severity. The blocking dependency gate is the Trivy HIGH/CRITICAL
      # scan in container-security; lower-severity items are picked up by the
      # weekly Dependabot pip group.
      - name: Run pip-audit (dependency advisories, informational)
        run: |
          pip-audit -r backend/requirements.txt --no-deps --desc=off
          # The module-only pins (python3-saml, the warehouse drivers) live in
          # their own file and would otherwise be audited nowhere.
          if [ -f modules/requirements.txt ]; then
            pip-audit -r modules/requirements.txt --no-deps --desc=off
          fi
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  frontend-security:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=high
        continue-on-error: true

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # Both trees, for the reason Bandit takes both: the SAML XML parser, the
      # PHI encryption, the SQL-string-building warehouse connectors and the
      # platform's only anonymous write path all live under modules/backend/app
      # now, and `backend/app/` reaches none of them. modules/ is absent in a
      # core checkout, so it is passed only when it is there.
      - name: Run Semgrep
        run: |
          targets=backend/app/
          if [ -d modules/backend/app ]; then targets="$targets modules/backend/app/"; fi
          echo "semgrep scan ... $targets"
          # shellcheck disable=SC2086
          semgrep scan \
            --config "p/python" \
            --config "p/security-audit" \
            --config "p/secrets" \
            --config "p/owasp-top-ten" \
            --error \
            --json \
            --output semgrep-report.json \
            $targets

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json

  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits via the API on pull_request
    # events; the default token has no pull-requests scope, so grant it.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git-secrets

      - name: Detect secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # `backend/` covers the core image's pins; the full image adds
      # modules/requirements.txt on top, and that file was in no gate and in
      # no SBOM. trivy takes one path per invocation, so the modules get their
      # own scan and their own SBOM. Absent in a core checkout.
      # (trivy's pip analyser reads files named requirements.txt only, so
      # neither tree's .lock is scanned here -- pip-audit above covers those.)
      - name: Scan filesystem for vulnerabilities
        run: |
          trivy fs --severity HIGH,CRITICAL --exit-code 1 --format table backend/
          if [ -d modules ]; then
            trivy fs --severity HIGH,CRITICAL --exit-code 1 --format table modules/
          fi
        continue-on-error: false

      - name: Generate SBOM
        run: |
          trivy fs --format cyclonedx --output sbom.json backend/
          if [ -d modules ]; then
            trivy fs --format cyclonedx --output sbom-modules.json modules/
          fi

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom-report
          path: |
            sbom.json
            sbom-modules.json
          # `modules/` is absent in a core checkout, so one of the two may not
          # exist; the SBOM upload must not fail the scan over that.
          if-no-files-found: warn
          retention-days: 90

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [python-security, frontend-security, semgrep, secret-detection, container-security]
    if: always()
    steps:
      - name: Check security scan results
        run: |
          if [ "${{ needs.python-security.result }}" == "failure" ] || \
             [ "${{ needs.semgrep.result }}" == "failure" ] || \
             [ "${{ needs.secret-detection.result }}" == "failure" ] || \
             [ "${{ needs.container-security.result }}" == "failure" ]; then
            echo "::error::One or more security scans failed"
            exit 1
          fi
          echo "All security scans passed"
