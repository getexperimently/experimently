# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = %(here)s/migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for all available tokens
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `alembic[tz]` to the pip requirements
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field
# truncate_slug_length = 40

# Run migrations/env.py during `alembic revision` too, not only for
# --autogenerate.  env.py is what resolves the `..` in the modules' version
# location below (see the note there); without it `alembic revision --head
# modules@head` fails with "Path ... is not represented in current version
# locations" and a module's migration cannot be generated at all.  The cost is
# that `alembic revision` now needs the database env.py connects to -- which
# --autogenerate, the documented way to generate one here, needs anyway.
revision_environment = true

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# Version locations: the core chain, and the modules branch (label `modules`,
# first revision modules_0001_rbac, which branches off the core revision
# a7b8c9d0e1f2 -- it must run after that one, and the core chain goes on from
# the same point at b8c9d0e1f2a3).  The modules' directory lives under
# modules/, which a core build deletes whole; alembic skips a listed directory
# that does not exist, so a core checkout sees one head and a full checkout
# sees two.  Because there can be two heads, name them plurally: `upgrade
# heads`, `stamp heads` (db/bootstrap.py does).  env.py refuses to run at all
# when modules/ is present but its registration is broken
# (require_modules_or_absent).
#
# Both entries are anchored at %(here)s -- the directory holding this file,
# backend/app/db -- and NOT at the working directory.  A path relative to the
# working directory is silently wrong from anywhere but the repository root:
# alembic skips a version location that does not exist, so `alembic -c
# app/db/alembic.ini heads` run from backend/ used to print one head, `upgrade
# heads` applied nothing and exited 0, and `revision --autogenerate` saw a
# single head -- so the two-heads guard never fired and the module tables
# landed in a *core* migration (env.py loads the module models either way).
#
# With two heads, `alembic revision` needs to be told which one it extends:
#   alembic revision --autogenerate --head modules@head -m "..."     (a module)
#   alembic revision --autogenerate --head <core head id> -m "..."   (core)
# alembic derives the target directory from the head's own file, and compares
# it against these configured paths -- the head's path resolved, these merely
# made absolute, so the `..` below would never match.  migrations/env.py
# resolves them before that comparison happens; `revision_environment = true`
# above is what guarantees env.py runs for every `alembic revision`, not only
# for --autogenerate.
version_locations =
    %(here)s/migrations/versions
    %(here)s/../../../modules/backend/app/db/migrations/versions

# One location per line above.  (`path_separator` replaced the deprecated
# `version_path_separator` in alembic 1.16; `newline` keeps the list readable.)
path_separator = newline

# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/%(POSTGRES_DB)s


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# lint with attempts to fix using "ruff" - use the exec runner, execute a binary
# hooks = ruff
# ruff.type = exec
# ruff.executable = %(here)s/.venv/bin/ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
