[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require database)
    e2e: End-to-end tests (require full stack)
    slow: Slow running tests
    requires_db: Tests requiring database connection
    requires_aws: Tests requiring AWS services (LocalStack)
    contract: API contract tests
    cognito_integration: Cognito authentication integration tests (require moto)
asyncio_mode = auto
