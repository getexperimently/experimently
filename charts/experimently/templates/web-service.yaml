apiVersion: v1
kind: Service
metadata:
  name: {{ include "experimently.fullname" . }}-web
  labels:
    {{- include "experimently.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "experimently.selectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
