{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "experimently.serviceAccountName" . }}
  labels:
    {{- include "experimently.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Nothing in Experimently talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
